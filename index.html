    <!-- 🌟 [가속 20] FOUC Absolute Fail-Safe (이중 하얀 화면 먹통 원천 방지) -->
    <style>
        .fouc-lock { opacity: 0 !important; visibility: hidden !important; }
    </style>
    <script>
        document.documentElement.classList.add('fouc-lock');
        window._foucTimer = setTimeout(function() {
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        }, 800);

        window.addEventListener('load', function() {
            clearTimeout(window._foucTimer);
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        });

        // 🚀 Passive Event Listener 강제화로 스크롤 버벅임(Jank) 타파
        window.addEventListener('touchstart', function() {}, {passive: true});
        window.addEventListener('wheel', function() {}, {passive: true});
    </script>

        /* 🌟 iOS 사파리 줌인 버그 차단 및 다크 테마 오토필 방어 */

        .premium-input:focus {

        .floating-label-group { position: relative; }
        .floating-label {
            position: absolute;
            left: 3rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            transition: all 0.2s ease-out;
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        /* 포커스 되거나 값이 있을 때 위로 이동 */
        .premium-input:focus ~ .floating-label,
        .premium-input:not(:placeholder-shown) ~ .floating-label {
            top: 0;
            transform: translateY(-50%) scale(0.85);
            left: 1rem;
            color: var(--sinjeon-vibrant);
            background: #0f172a; /* 라벨 배경 덮어쓰기 */
            padding: 0 6px;
            border-radius: 4px;
        }

        .btn-hip {
            background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);

            border: none;

            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
            position: relative;
            overflow: hidden;
        }

            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transition: none;

        .cinematic-enter { opacity: 0; transform: translateY(20px) translateZ(0); animation: fadeUpCinematic 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; will-change: opacity, transform; }

        @keyframes fadeUpCinematic { to { opacity: 1; transform: translateY(0) translateZ(0); } }

        @keyframes error-shake {

            20% { transform: translateX(-8px) translateZ(0); }
            40% { transform: translateX(8px) translateZ(0); }
            60% { transform: translateX(-4px) translateZ(0); }
            80% { transform: translateX(4px) translateZ(0); }

        #premiumToastContainer {

                    else if (_sysRole === "PARTNER") { window.location.replace("dashboard.html"); } 
                    else { window.location.replace("items.html"); }

                    <svg id="btnSpinner" class="animate-spin h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
            
            <footer class="mt-10 text-center border-t border-white/10 pt-6 space-y-1.5">
                <p class="font-montserrat text-[9px] font-bold text-gray-500 tracking-[0.2em] uppercase opacity-80">
                    Operated by Y2C Holdings Ltd.
                </p>
                <p class="font-montserrat text-[8.5px] font-black text-gray-600 tracking-[0.2em] uppercase flex items-center justify-center gap-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> System V40.36 Enterprise
                </p>
            </footer>
        </form>
    </main>

<script>
/**
 * 🌟 V40.36 Enterprise Ultimate Auth Gateway
 * [20+ Improvements] Telemetry, Canvas Mesh, IIFE Isolation, Dynamic Greeting, Toast System
 */

(function() {
    "use strict";

    // 🌟 [보안 8] 클라이언트 원격 텔레메트리 (Telemetry Engine)
    class TelemetryEngine {
        static collect() {
            try {
                return {
                    tz: Intl.DateTimeFormat().resolvedOptions().timeZone || "Unknown",
                    lang: navigator.language || "en",
                    scr: `${window.screen.width}x${window.screen.height}`,
                    agent: navigator.userAgent.substring(0, 150),
                    plat: navigator.platform || "Unknown",
                    net: navigator.connection ? navigator.connection.effectiveType : "Unknown",
                    ts: Date.now()
                };
            } catch(e) { return { error: "Telemetry Denied" }; }
        }
    }

    // 🌟 [고급화 5] 프리미엄 토스트 알림망
    class ToastSystem {
        static show(message, type = "error") {
            const container = document.getElementById('premiumToastContainer');
            if(!container) return;

            const toast = document.createElement('div');
            toast.className = 'toast-item';
            
            let icon = type === "error" ? `<svg class="w-5 h-5 text-[#FF3B5C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>` 
                     : type === "success" ? `<svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`
                     : `<svg class="w-5 h-5 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>`;
            
            toast.style.borderLeftColor = type === "error" ? "var(--sinjeon-vibrant)" : type === "success" ? "#34d399" : "#fbbf24";
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            requestAnimationFrame(() => {
                setTimeout(() => toast.classList.add('show'), 10);
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400);
            }, 4000);
        }
    }

    // 🌟 [고급화 1, 가속 15] 동적 캔버스 파티클 레이어 (Memory Leak 방지 적용)
    class ParticleMesh {
        constructor(canvasId) {
            this.canvas = document.getElementById(canvasId);
            if(!this.canvas) return;
            this.ctx = this.canvas.getContext('2d');
            this.particles = [];
            this.density = window.innerWidth < 768 ? 40 : 80;
            this.mouseX = 0;
            this.mouseY = 0;
            
            this.resize();
            this.initParticles();
            
            // ResizeObserver 활용 메모리 누수 방어
            const ro = new ResizeObserver(() => this.resize());
            ro.observe(document.body);

            window.addEventListener('mousemove', (e) => {
                this.mouseX = e.clientX;
                this.mouseY = e.clientY;
            }, {passive: true});

            requestAnimationFrame(() => this.animate());
        }

        resize() {
            this.canvas.width = window.innerWidth;
            this.canvas.height = window.innerHeight;
        }

        initParticles() {
            this.particles = [];
            for(let i=0; i<this.density; i++) {
                this.particles.push({
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * this.canvas.height,
                    vx: (Math.random() - 0.5) * 0.5,
                    vy: (Math.random() - 0.5) * 0.5,
                    size: Math.random() * 2 + 0.5
                });
            }
        }

        animate() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            this.ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            
            for(let i=0; i<this.particles.length; i++) {
                let p = this.particles[i];
                p.x += p.vx; p.y += p.vy;

                if(p.x < 0 || p.x > this.canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > this.canvas.height) p.vy *= -1;

                this.ctx.beginPath();
                this.ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                this.ctx.fill();

                // Mouse interaction
                let dx = this.mouseX - p.x;
                let dy = this.mouseY - p.y;
                let dist = Math.sqrt(dx*dx + dy*dy);
                if(dist < 150) {
                    this.ctx.beginPath();
                    this.ctx.strokeStyle = `rgba(227, 0, 15, ${0.15 - dist/1000})`;
                    this.ctx.lineWidth = 1;
                    this.ctx.moveTo(p.x, p.y);
                    this.ctx.lineTo(this.mouseX, this.mouseY);
                    this.ctx.stroke();
                }
            }
            requestAnimationFrame(() => this.animate());
        }
    }

    // Config & API Endpoint
    const CONFIG = (typeof window.SYSTEM_CONFIG !== 'undefined') ? window.SYSTEM_CONFIG : {
        API: { BASE_URL: "https://script.google.com/macros/s/AKfycbyPWfrhETBWY1ThDwiNnTxL9h7-0zduGiYL2W0oLoNPeHNaNfYqZLft7SNWmKooDHFfhQ/exec" }, 
        STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client" }
    };
    const TARGET_API_URL = (CONFIG.API && CONFIG.API.BASE_URL) ? CONFIG.API.BASE_URL : "https://script.google.com/macros/s/AKfycbyPWfrhETBWY1ThDwiNnTxL9h7-0zduGiYL2W0oLoNPeHNaNfYqZLft7SNWmKooDHFfhQ/exec";

    function escapeHtml(value) {
        return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // 🌟 [가속 17] DOM Ready 프록시 록다운
    document.addEventListener("DOMContentLoaded", () => {
        
        // 🌟 [고급화 2] 동적 그리팅 (시간대별 메시지)
        const greetingEl = document.getElementById('dynamicGreeting');
        if (greetingEl) {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) greetingEl.innerText = "Good Morning, Partner";
            else if (hour >= 12 && hour < 18) greetingEl.innerText = "Good Afternoon, Partner";
            else greetingEl.innerText = "Good Evening, Partner";
        }

        // Initialize Background
        new ParticleMesh('particleCanvas');

        // 🌟 [보안 9] 로컬스토리지 무결성 검증 (Incognito 방어)
        try {
            localStorage.setItem("y2c_test", "1");
            localStorage.removeItem("y2c_test");
        } catch(e) {
            ToastSystem.show("Warning: Storage is disabled. App may not function correctly.", "warning");
        }

        // 🌟 [가속 14] 네트워크 속도 감지 경고
        if(navigator.connection && (navigator.connection.effectiveType === '2g' || navigator.connection.effectiveType === 'slow-2g')) {
            ToastSystem.show("Slow network detected. Login may take longer.", "warning");
        }

        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const btnText = document.getElementById("btnText");
        const btnSpinner = document.getElementById("btnSpinner");
        const idInput = document.getElementById("userId");
        const pwInput = document.getElementById("userPw");
        const hpInput = document.getElementById("hp_field");
        const errorMsg = document.getElementById("loginErrorMsg"); // 레거시 100% 호환 보존
        const capsLockWarning = document.getElementById("capsLockWarning");

        // 🌟 [고급화 4] 비밀번호 토글
        const togglePwBtn = document.getElementById('togglePwBtn');
        const eyeOpen = document.getElementById('eyeIconOpen');
        const eyeClosed = document.getElementById('eyeIconClosed');
        if(togglePwBtn && pwInput) {
            togglePwBtn.addEventListener('click', () => {
                if(pwInput.type === 'password') {
                    pwInput.type = 'text';
                    eyeClosed.classList.add('hidden');
                    eyeOpen.classList.remove('hidden');
                } else {
                    pwInput.type = 'password';
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                }
            });
        }

        let isAuthenticating = false;
        let authTimeoutFallback = null;

        window.addEventListener('offline', () => { ToastSystem.show("인터넷 연결이 끊어졌습니다.", "warning"); });
        window.addEventListener('online', () => { 
            ToastSystem.show("네트워크가 복구되었습니다.", "success");
            isAuthenticating = false; resetLoginButton();
        });

        window.addEventListener('unhandledrejection', function(event) {
            console.error("[Y2C Telemetry Promise Rejection]", event.reason);
            if (isAuthenticating) {
                isAuthenticating = false;
                ToastSystem.show("통신 중 시스템 예외가 발생했습니다.", "error");
                resetLoginButton(); triggerShake();
            }
        });

        if (pwInput && capsLockWarning) {
            pwInput.addEventListener('keyup', (e) => {
                if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
                else { capsLockWarning.classList.remove('active'); }
            });
            pwInput.addEventListener('blur', () => { capsLockWarning.classList.remove('active'); });
        }

        // 🌟 [가속 19] 키보드 접근성 (Ctrl+Enter)
        loginForm.addEventListener('keydown', (e) => {
            if((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                loginBtn.click();
            }
        });

        function triggerShake() {
            if (!loginForm) return;
            loginForm.classList.remove('shake-animation');
            void loginForm.offsetWidth;
            loginForm.classList.add('shake-animation');
        }

        function resetLoginButton() {
            if (loginBtn) {
                loginBtn.disabled = false; 
                if(btnText) btnText.classList.remove('hidden');
                if(btnSpinner) btnSpinner.classList.add('hidden');
                loginBtn.style.background = ""; 
                loginBtn.style.color = "";
                loginBtn.classList.remove('cursor-not-allowed', 'pointer-events-none');
            }
        }

        // 🌟 [가속 18] 지수 백오프 기반 Fetch 로직 고도화
        async function executeLogin(payload, retries = 2) {
            if (!navigator.onLine) throw new Error("네트워크가 끊어졌습니다. Wi-Fi 상태를 확인하세요.");
            const safePayload = (typeof payload === 'object' && payload !== null && !Array.isArray(payload)) ? payload : {};
            let lastNetworkError;

            // 🌟 [보안 8] Telemetry 결합
            const telemetry = TelemetryEngine.collect();
            const finalPayload = { action: "login", telemetry: telemetry, ...safePayload };

            for (let i = 0; i <= retries; i++) {
                let controller = new AbortController();
                let timeoutId = setTimeout(() => controller.abort(), 15000); 

                try {
                    const response = await fetch(TARGET_API_URL, {
                        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                        redirect: "follow", body: JSON.stringify(finalPayload),
                        signal: controller.signal
                    });

                    if (!response.ok) {
                        const httpError = new Error(`HTTP ${response.status}`);
                        httpError.httpStatus = response.status;
                        if(response.status === 401 || response.status === 403 || response.status === 404) httpError.isFatal = true;
                        throw httpError;
                    }

                    const rawText = await response.text();
                    
                    let jsonResult;
                    try { jsonResult = JSON.parse(rawText); } 
                    catch (parseErr) { throw new Error("서버 응답 파싱 실패. 배포 설정을 확인하세요."); }

                    if (!jsonResult || typeof jsonResult !== 'object') {
                        throw new Error("서버 응답 규격 무결성 훼손.");
                    }

                    return jsonResult;
                } catch (err) {
                    lastNetworkError = err;
                    
                    if (err.isFatal) throw err;
                    
                    if (err && err.httpStatus) {
                        if (err.httpStatus === 429) throw new Error("서버 접속 대기열 초과 (HTTP 429).");
                        if (err.httpStatus === 503) throw new Error("서버 일시적 점검 중 (HTTP 503).");
                    }
                    
                    if (err.message && err.message.includes("Failed to fetch")) {
                        lastNetworkError = new Error("🚨 구글 서버 접근 차단됨(CORS). 배포 권한을 확인하세요.");
                    }

                    if (i < retries) {
                        const waitTime = (Math.pow(1.6, i) * 1000) + Math.floor(Math.random() * 500); 
                        ToastSystem.show(`보안 통신망 재시도 중... (${i+1}/${retries})`, "warning");
                        await new Promise(res => setTimeout(res, waitTime));
                    }
                } finally {
                    clearTimeout(timeoutId);
                    controller = null;
                }
            }
            throw new Error(lastNetworkError?.name === 'AbortError' ? "서버 응답 시간 초과 (15초 지연)." : (lastNetworkError?.message || "보안 서버 통신 실패."));
        }

        if (loginForm) { 
            loginForm.addEventListener("submit", async (e) => {
                e.preventDefault(); 
                if (isAuthenticating) return;

                // 🌟 [보안 7] 허니팟 방어 작동
                if (hpInput && hpInput.value.length > 0) {
                    ToastSystem.show("비정상적인 접근이 감지되었습니다.", "error");
                    return;
                }

                const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
                const pw = pwInput ? String(pwInput.value).trim() : "";

                if (!id || !pw) {
                    ToastSystem.show("ID와 Passkey를 모두 입력해주세요.", "error");
                    triggerShake();
                    return;
                }

                // 🌟 [보안 12] Double-Submit 방어
                isAuthenticating = true;
                
                clearTimeout(authTimeoutFallback);
                authTimeoutFallback = setTimeout(() => {
                    if(isAuthenticating) {
                        isAuthenticating = false;
                        resetLoginButton();
                        ToastSystem.show("시스템 렌더링 시간이 초과되었습니다. 다시 시도해 주세요.", "error");
                    }
                }, 20000);

                if (loginBtn) {
                    loginBtn.disabled = true;
                    if(btnText) btnText.classList.add('hidden');
                    if(btnSpinner) btnSpinner.classList.remove('hidden');
                    loginBtn.style.background = "rgba(255, 255, 255, 0.05)";
                    loginBtn.classList.add('cursor-not-allowed', 'pointer-events-none');
                }

                let loginResult = null; 
                let isSuccessRedirecting = false;

                try {
                    loginResult = await executeLogin({ username: id, password: pw });

                    if (loginResult && loginResult.success) {
                        ToastSystem.show("✅ SECURE SESSION ESTABLISHED", "success");
                        
                        try {
                            // 클리어 및 세션 저장
                            const keysToClear = [CONFIG.STORAGE_KEYS.USER_TOKEN, CONFIG.STORAGE_KEYS.ROLE, CONFIG.STORAGE_KEYS.CLIENT_NAME, 'y2c_id', 'y2c_premium_state'];
                            keysToClear.forEach(k => { try { localStorage.removeItem(k); } catch(e){} });

                            const role = String(loginResult.role || "").toUpperCase();
                            
                            // 🌟 [치명적 버그 소각] Region 누락 시 MASTER/VENDOR 강제 바이패스
                            let region = String(loginResult.region || "").trim();
                            if (!region || region === "null" || region === "undefined") {
                                if (role === 'MASTER' || role === 'VENDOR') {
                                    region = 'ALL'; 
                                } else {
                                    throw new Error("접근 지역(State)이 명시되지 않았습니다.");
                                }
                            }

                            localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, loginResult.token || "Y2C_SECURE_TOKEN_" + Date.now());
                            localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, role);
                            localStorage.setItem("y2c_region", region);
                            localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, loginResult.clientName || id);
                            localStorage.setItem("y2c_id", id);
                            localStorage.setItem("y2c_premium_state", loginResult.clientState || "DEFAULT");
                            
                            isSuccessRedirecting = true;
                        } catch(stErr) { 
                            throw new Error("로컬 스토리지 할당 실패: 기기 용량을 확인하거나 시크릿 모드를 해제하세요."); 
                        }

                        // 시네마틱 페이드아웃 후 강제 라우팅
                        if (loginForm) { 
                            loginForm.style.transition = "opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s"; 
                            loginForm.style.opacity = "0"; 
                            loginForm.style.transform = "scale(0.95)";
                            loginForm.style.pointerEvents = "none"; 
                        }
                        
                        clearTimeout(authTimeoutFallback);
                        
                        setTimeout(() => {
                            const targetRole = String(loginResult.role).toUpperCase();
                            if (targetRole === "MASTER" || targetRole === "VENDOR") {
                                window.location.replace("admin.html");
                            } else if (targetRole === "PARTNER") {
                                window.location.replace("dashboard.html");
                            } else {
                                window.location.replace("items.html");
                            }
                        }, 600);

                    } else {
                        ToastSystem.show(`⚠️ ${escapeHtml(loginResult?.message || "보안 인증이 거부되었습니다.")}`, "error");
                        triggerShake(); 
                    }
                } catch (err) {
                    ToastSystem.show(err.message, "error");
                    // 기존 레거시 호환을 위해 hidden 에러 박스에도 텍스트 세팅
                    if(errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">${err.message}</span>`; }
                    triggerShake(); 
                } finally {
                    clearTimeout(authTimeoutFallback);
                    if (!isSuccessRedirecting) {
                        isAuthenticating = false;
                        resetLoginButton();
                    }
                }
            }); 
        }
        
        // 초기 입력창 포커스
        setTimeout(() => {
            if(idInput) idInput.focus();
        }, 500);
    });
})();
</script>
</body>
