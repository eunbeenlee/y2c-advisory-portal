<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sinjeon Canada Partner Portal</title>
  <!-- 폰트 및 심플한 UI 툴킷(Tailwind CSS) 로드 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* 신전 떡볶이 시그니처 레드 컬러 커스텀 */
    .bg-sinjeon { background-color: #E53935; }
    .text-sinjeon { color: #E53935; }
    .hover-sinjeon:hover { background-color: #C62828; }
  </style>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">
  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">Partner Portal</h1>
      <p class="text-sm text-gray-500 mt-1">Sinjeon Foodsys Canada</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="userId" class="block text-sm font-medium text-gray-700">Partner ID</label>
        <input type="text" id="userId" required 
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-red-500">
      </div>
      <div>
        <label for="userPw" class="block text-sm font-medium text-gray-700">Password</label>
        <input type="password" id="userPw" required 
               class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-1 focus:ring-red-500">
      </div>
      
      <!-- 에러 메시지 표시 영역 -->
      <div id="errorMessage" class="text-red-500 text-sm hidden"></div>

      <button type="submit" id="loginBtn" 
              class="w-full bg-sinjeon text-white py-2 px-4 rounded-md hover-sinjeon focus:outline-none transition-colors">
        Sign In
      </button>
    </form>
  </div>

  <!-- 설정 및 로그인 로직 스크립트 연결 -->
  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
