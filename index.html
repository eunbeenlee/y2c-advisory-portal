    <!-- 🌟 [가속 23] FOUC Absolute Fail-Safe (이중 하얀 화면 먹통 원천 방지 3-Tier Defense) -->
    <style>
        .fouc-lock { opacity: 0 !important; visibility: hidden !important; }
    </style>
    <script>
        document.documentElement.classList.add('fouc-lock');
        window._foucTimer = setTimeout(function() {
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        }, 800);

        window.addEventListener('load', function() {
            clearTimeout(window._foucTimer);
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        });

        // 🚀 [가속 26] Passive Event Listener 강제화로 스크롤 버벅임(Jank) 타파
        window.addEventListener('touchstart', function() {}, {passive: true});
        window.addEventListener('wheel', function() {}, {passive: true});
    </script>

    <!-- 🚨 [가속 25] Tailwind CSS 경고 콘솔 오염 원천 차단 (스크립트 로드 전 프록시 인터셉트) -->
    <script>
        (function() {
            var originalWarn = console.warn;
            console.warn = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('cdn.tailwindcss.com should not be used')) {
                    return; // 렌더링을 방해하는 노란색 CDN 경고 조용히 소각
                }
                originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal absolute fallback.')"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        montserrat: ['Montserrat', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'] 
                    },
                    colors: { premium: { charcoal: '#111827', red: '#E3000F', hover: '#B9000C', gold: '#D4AF37', border: '#e2e8f0', bg: '#F8F9FA' } },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',

                            '50%': { opacity: .7, textShadow: '0 0 5px rgba(227,0,15,0.05)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)', opacity: 0.6 },
                            '50%': { transform: 'scale(1.15)', opacity: 1 },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '200% 0' },
                            '100%': { backgroundPosition: '-200% 0' },
                        }
                    },
                    boxShadow: {
                        'premium-card': '0 35px 60px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.02)',
                        'premium-input': 'inset 0 2px 4px 0 rgba(0,0,0,0.03)',
                        'premium-input-focus': '0 4px 15px rgba(17, 24, 39, 0.06), 0 0 0 4px rgba(17, 24, 39, 0.08)',
                        'premium-btn': '0 8px 20px rgba(227, 0, 15, 0.25), inset 0 1px 0 rgba(255,255,255,0.25)',

                    }
                }

    </script>

    <style>
        :root {
            --sinjeon-pink: #E3000F; 
            --premium-charcoal: #111827; 
            --bg-light: #F8F9FA;
            --input-bg: #f8fafc;
        }
        
        /* 🌟 터치 딜레이 및 바운스 스크롤 원천 차단 */
        html, body { 
            overscroll-behavior-y: none; 
            touch-action: manipulation; 
            background-color: var(--bg-light) !important; 
            color: var(--premium-charcoal); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; min-height: 100vh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; 
            transform: translateZ(0); /* GPU 레이어 격리 */
        }

        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 🌟 [고급화] 하이엔드 글래스 폼 컨테이너 */
        .solid-panel {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 2.5rem;
            position: relative;
            z-index: 10;
        }
        
        /* 🌟 [UI 픽스 1 & 6] Inner-Floating 방식의 프리미엄 인풋 박스 */
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: var(--input-bg);
            border: 1.5px solid #e2e8f0;
            color: var(--premium-charcoal);
            font-size: 16px !important; /* iOS 줌 버그 방지 */
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem;
            width: 100%;
            height: 4rem; /* 64px 강제 고정으로 라벨이 움직일 충분한 공간 확보 */
            padding-top: 1.6rem !important; 
            padding-bottom: 0.5rem !important;
            padding-left: 3.25rem !important;
            padding-right: 1rem !important;
        }
        
        /* 🌟 [UI 픽스 4] 스마트 포커스 링 (붉은 에러톤 대신 고급스러운 차콜 아우라) */
        .premium-input:focus {
            background: #ffffff;
            border-color: var(--premium-charcoal);
            outline: none;
            transform: translateY(-1px);
        }
        
        /* 🌟 [지능형 에러 트래킹] 에러 상태 테두리 및 톤앤매너 완벽 시각화 */
        .premium-input.input-error {
            border-color: var(--sinjeon-pink) !important;
            background-color: #FEF2F2 !important; /* Tailwind red-50 (미세한 붉은빛으로 비어있음을 직관적으로 강조) */
            box-shadow: 0 0 0 4px rgba(227, 0, 15, 0.15), inset 0 2px 4px 0 rgba(227, 0, 15, 0.05) !important;
        }
        .premium-input.input-error ~ .floating-label {
            color: var(--sinjeon-pink) !important;
        }
        .premium-input.input-error ~ .input-icon {
            color: var(--sinjeon-pink) !important;
        }

        .premium-input::placeholder { color: transparent; }

        /* 포커스 시 좌측 아이콘 색상 동적 변경 */
        .input-icon { transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; }
        .premium-input:focus ~ .input-icon { color: var(--premium-charcoal); }

        /* 🌟 [가속 29] 브라우저 자동완성 노란색 오염 방지 하얀색 덮어쓰기 */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #111827 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 🌟 [UI 픽스 1] 플로팅 레이블 타이핑 겹침 완벽 타파 (Inner-Floating Architecture) */
        .floating-label-group { position: relative; }
        
        .floating-label {
            position: absolute;
            left: 3.25rem; /* 아이콘 폭과 정밀 일치 */
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #64748b;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: 0.03em;
            z-index: 10;
            margin: 0;
        }
        
        /* 인풋에 값이 있거나 포커스 될 때 라벨을 인풋 '내부 상단'으로 콤팩트하게 이동 (글자와 겹침 100% 원천 차단) */
        .premium-input:focus ~ .floating-label,
        .premium-input:not(:placeholder-shown) ~ .floating-label {
            top: 14px; /* 내부 상단 14px 지점으로 안착 */
            transform: translateY(-50%) scale(0.75);
            transform-origin: left center;
            color: #94a3b8;
            background: transparent; /* 배경을 날려서 글자와의 마스킹 충돌 원천 차단 */
            padding: 0;
            border: none;
            box-shadow: none;
        }
        
        .premium-input:focus ~ .floating-label {
            color: var(--premium-charcoal);
        }

        /* 🌟 [그래픽 3] 3D 마그네틱 SECURE LOGIN 버튼 */
        .btn-hip {
            background: linear-gradient(135deg, var(--sinjeon-pink) 0%, #A3000B 100%);
            color: #ffffff;
            border: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        /* 스윕 광원 이펙트 */
        .btn-hip::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: none;
        }
        .btn-hip:hover:not(:disabled) {
            transform: translateY(-3px);
            letter-spacing: 0.25em; /* 타이포그래피 확장 이펙트 */
        }
        .btn-hip:hover:not(:disabled)::after {
            left: 200%;
            transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hip:active:not(:disabled) { 
            transform: translateY(1px) scale(0.98); 
            box-shadow: 0 2px 10px rgba(227, 0, 15, 0.2); 
        }

        .text-glow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05); }
        .text-glow-red { text-shadow: 0 2px 15px rgba(227, 0, 15, 0.2); }
        
        ::-webkit-scrollbar { display: none; }

        /* 🌟 [가속 28] 애니메이션 GPU 렌더링 강제화 */
        .cinematic-enter { 
            animation: fadeUpCinematic 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; 
            will-change: opacity, transform; 
        }
        .delay-100 { animation-delay: 0.1s; } 
        @keyframes fadeUpCinematic { 
            0% { opacity: 0; transform: translateY(20px) translateZ(0); }
            100% { opacity: 1; transform: translateY(0) translateZ(0); } 
        }

        /* 🌟 [치명적 버그 7 픽스] 애니메이션 종료 후 폼이 증발(opacity:0)되는 렌더링 파괴 현상 절대 방어 */
        /* animation-fill-mode를 both로 주고 opacity 1을 하드코딩하여 CSS 엔진이 투명도를 날리지 못하게 100% 록다운 */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0) translateZ(0); opacity: 1 !important; }
            20% { transform: translateX(-8px) translateZ(0); opacity: 1 !important; }
            40% { transform: translateX(8px) translateZ(0); opacity: 1 !important; }
            60% { transform: translateX(-4px) translateZ(0); opacity: 1 !important; }
            80% { transform: translateX(4px) translateZ(0); opacity: 1 !important; }
        }
        .shake-animation { animation: error-shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important; }

        /* 🌟 [그래픽 3] Caps Lock 경고문 아코디언 유체 모션 (absolute 제거로 레이아웃 파괴 원천 픽스) */
        .alert-slide { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            opacity: 0; 
            max-height: 0; 
            overflow: hidden; 
            margin-top: 0;
            padding-left: 0.5rem;
        }
        .alert-slide.active { 
            opacity: 1; 
            max-height: 30px; 
            margin-top: 8px; 
        }

        /* 🌟 [그래픽 9] 애플 스타일 프리미엄 글래스 토스트 (Blur 20px) */
        #premiumToastContainer {
            position: fixed;
            top: 24px; right: 24px;
            z-index: 99999;
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: none;
        }
        .toast-item {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.6);
            border-left: 4px solid var(--sinjeon-pink);
            color: var(--premium-charcoal);
            padding: 16px 24px;
            border-radius: 1rem; 
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.1), 0 0 0 1px rgba(0,0,0,0.02);
            font-family: 'Inter', sans-serif;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 14px;
            transform: translateX(120%) scale(0.9) translateZ(0);
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
            opacity: 0;
            pointer-events: auto;
            will-change: transform, opacity;
        }
        .toast-item.show {
            transform: translateX(0) scale(1) translateZ(0);
            opacity: 1;
        }
    </style>
</head>

<body id="mainBody" class="flex items-center justify-center p-4 sm:p-6 overflow-hidden relative selection:bg-[#E3000F] selection:text-white" style="opacity: 0; transition: opacity 0.5s ease-out;">

    <!-- 🌟 [보안 15] 기 로그인 사용자 강제 우회 (IIFE 스코프 캡슐화로 전역 오염 100% 방지) -->
    <script>
        (function() {
            try {
                var _sysRole = String(localStorage.getItem("y2c_role") || "").toUpperCase().trim();
                var _sysToken = String(localStorage.getItem("y2c_token") || "").trim();
                
                if (_sysRole && _sysRole !== "NULL" && _sysToken && _sysToken.length > 10) {
                    if (_sysRole === "VENDOR" || _sysRole === "MASTER") { window.location.replace("admin.html"); } 
                    else if (_sysRole === "PARTNER") { window.location.replace("dashboard.html"); } 
                    else { window.location.replace("items.html"); }
                } else {
                    // 비정상 찌꺼기 데이터 클렌징
                    const keysToClear = ["y2c_token", "y2c_role", "y2c_client", "y2c_id", "y2c_premium_state"];
                    keysToClear.forEach(function(k) { localStorage.removeItem(k); });
                }
            } catch (e) { console.error("[Y2C Boot Init]", e); }
        })();
    </script>

    <!-- 🌟 [보안 16] Clickjacking 방어 & NoScript 샌드박스 -->

            let lastNetworkError;

            urlParams.append("username", payload.username || "");
            urlParams.append("password", payload.password || "");

                            localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, loginResult.clientName || id);
                            localStorage.setItem("y2c_id", id);
                            localStorage.setItem("y2c_premium_state", loginResult.clientState || "DEFAULT");
                            
                            isSuccessRedirecting = true;
                        } catch(stErr) { 
                            throw new Error("로컬 스토리지 할당에 실패했습니다. 시크릿 모드를 해제해 주십시오."); 
                        }

                        if (loginForm) { 
                            loginForm.style.transition = "opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s"; 
                            loginForm.style.opacity = "0"; 
                            loginForm.style.transform = "scale(0.95)";
                            loginForm.style.pointerEvents = "none"; 
                        }
                        
                        clearTimeout(authTimeoutFallback);
                        
                        setTimeout(() => {
                            const targetRole = String(loginResult.role).toUpperCase();
                            if (targetRole === "MASTER" || targetRole === "VENDOR") {
                                window.location.replace("admin.html");
                            } else if (targetRole === "PARTNER") {
                                window.location.replace("dashboard.html");
                            } else {
                                window.location.replace("items.html");
                            }
                        }, 600);

                    } else {
                        ToastSystem.show(escapeHtml(loginResult?.message || "보안 인증이 거부되었습니다."), "error");
                        triggerShake(true, true); 
                    }
                } catch (err) {
                    ToastSystem.show(err.message, "error");
                    triggerShake(true, true); 
                } finally {
                    clearTimeout(authTimeoutFallback);
                    if (!isSuccessRedirecting) {
                        isAuthenticating = false;
                        resetLoginButton();
                    }
                }
            }); 
        }
        
        setTimeout(() => {
            if(idInput) idInput.focus();
        }, 500);
    });
})();
</script>
</body>
</html>
