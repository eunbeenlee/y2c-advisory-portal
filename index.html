<!DOCTYPE html>
<!-- 
  🌟 V40.66 Enterprise Login ULTIMATE - Presentation Layer Masterpiece 🌟
  [ARCH SHIFT] Fully decoupled from Network Logic. Delegates 100% to external `auth.js` (V40.65).
  [TRUE SYNC] Network Payload and DOM manipulations strictly controlled by Y2C_AuthEngine.
  [PERFORMANCE] Zero-Latency Initial Routing (IIFE), CSSOM Unblocking, GPU Acceleration.
  [PREMIUM UI] Inner-Floating Labels, Magnetic 3D Buttons, Glassmorphism Toast Target.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    
    <!-- 🌟 [보안 1] CSP 방어망 및 모바일 웹앱 풀스크린 록다운 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#F8F9FA">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Y2C Portal">
    <meta name="description" content="SINJEON CANADA Enterprise Portal Secure Login Gateway | Operated by Y2C Holdings">
    <meta name="robots" content="noindex, nofollow">
    <meta name="format-detection" content="telephone=no">
    
    <title>SINJEON CANADA | Enterprise Portal</title>
    
    <!-- 🚀 [가속 2] 구글 서버 및 폰트 CDN 조기 연결 (DNS-Prefetch & Preconnect) -->
    <link rel="preconnect" href="https://script.google.com" crossorigin>
    <link rel="dns-prefetch" href="https://script.google.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <!-- 🚀 [가속 3] 핵심 사내 포털 리소스 백그라운드 사전 다운로드 (Sub-resource Prefetching) -->
    <link rel="prefetch" href="dashboard.html" as="document">
    <link rel="prefetch" href="admin.html" as="document">
    <link rel="prefetch" href="items.html" as="document">
    <link rel="prefetch" href="recipes.html" as="document">
    <link rel="prefetch" href="invoice.html" as="document">

    <!-- 🚨 [가속 4] LCP(Largest Contentful Paint) 최적화를 위한 파비콘 최우선 로딩 강제 -->
    <link rel="preload" href="favicon.png" as="image" type="image/png" fetchpriority="high">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    
    <!-- 🚀 [가속 5] CSSOM 블로킹 타파를 위한 비동기 폰트 로드 아키텍처 -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700;800&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700;800&display=swap"></noscript>

    <!-- 🌟 [가속 6] FOUC Absolute Fail-Safe (하얀 화면 렌더링 먹통 이중 차단망) -->
    <style>
        .fouc-lock { opacity: 0 !important; visibility: hidden !important; }
    </style>
    <script>
        document.documentElement.classList.add('fouc-lock');
        window._foucTimer = setTimeout(function() {
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        }, 800);

        window.addEventListener('load', function() {
            clearTimeout(window._foucTimer);
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) document.body.style.opacity = '1';
        });

        // 🚀 [가속 7] Passive Event Listener 강제화로 모바일 휠/터치 프레임 드랍(Jank) 100% 방지
        window.addEventListener('touchstart', function() {}, {passive: true});
        window.addEventListener('wheel', function() {}, {passive: true});
        window.addEventListener('scroll', function() {}, {passive: true});
    </script>

    <!-- 🚨 [가속 8] Tailwind CSS Warning Hijacker (콘솔 노란색 경고창 렌더링 블로킹 원천 차단 프록시) -->
    <script>
        (function() {
            var originalWarn = console.warn;
            console.warn = function() {
                if (arguments[0] && typeof arguments[0] === 'string' && arguments[0].includes('cdn.tailwindcss.com should not be used')) {
                    return; 
                }
                originalWarn.apply(console, arguments);
            };
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 🌟 [그래픽 1] Tailwind 커스텀 테마 엔진 구축 (대기업 브랜드 컬러코드 주입) -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        montserrat: ['Montserrat', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'] 
                    },
                    colors: { 
                        premium: { charcoal: '#111827', red: '#E3000F', hover: '#B9000C', gold: '#D4AF37', border: '#e2e8f0', bg: '#F8F9FA' }
                    },
                    animation: {
                        'spin-slow': 'spin 3s linear infinite',
                        'pulse-glow': 'pulseGlow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'heartbeat': 'heartbeat 2s ease-in-out infinite',
                        'shimmer': 'shimmer 2s linear infinite',
                    },
                    keyframes: {
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, textShadow: '0 0 15px rgba(227,0,15,0.2)' },
                            '50%': { opacity: .7, textShadow: '0 0 5px rgba(227,0,15,0.05)' },
                        },
                        heartbeat: {
                            '0%, 100%': { transform: 'scale(1)', opacity: 0.6 },
                            '50%': { transform: 'scale(1.15)', opacity: 1 },
                        },
                        shimmer: {
                            '0%': { backgroundPosition: '200% 0' },
                            '100%': { backgroundPosition: '-200% 0' },
                        }
                    },
                    boxShadow: {
                        'premium-card': '0 35px 60px -15px rgba(0, 0, 0, 0.08), 0 0 0 1px rgba(0,0,0,0.02)',
                        'premium-input': 'inset 0 2px 4px 0 rgba(0,0,0,0.03)',
                        'premium-input-focus': '0 4px 15px rgba(17, 24, 39, 0.06), 0 0 0 4px rgba(17, 24, 39, 0.08)',
                        'premium-btn': '0 8px 20px rgba(227, 0, 15, 0.25), inset 0 1px 0 rgba(255,255,255,0.25)',
                        'premium-btn-hover': '0 15px 30px rgba(227, 0, 15, 0.4), inset 0 1px 0 rgba(255,255,255,0.3)',
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Variables 록다운 */
        :root {
            --sinjeon-pink: #E3000F; 
            --premium-charcoal: #111827; 
            --bg-light: #F8F9FA;
            --input-bg: #f8fafc;
        }
        
        /* 🌟 [UX 1] 터치 딜레이, 바운스 스크롤, 텍스트 드래그 하이라이트 원천 차단 */
        html, body { 
            overscroll-behavior-y: none; 
            touch-action: manipulation; 
            background-color: var(--bg-light) !important; 
            color: var(--premium-charcoal); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; min-height: 100vh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; 
            transform: translateZ(0); /* GPU 레이어 격리 가속 */
        }

        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* 🌟 [그래픽 2] 하이엔드 글래스 폼 컨테이너 */
        .solid-panel {
            background: #ffffff;
            border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 2.5rem;
            position: relative;
            z-index: 10;
        }
        
        /* 🌟 [그래픽 3] Inner-Floating 방식의 프리미엄 인풋 박스 (텍스트 겹침 100% 원천 차단) */
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: var(--input-bg);
            border: 1.5px solid #e2e8f0;
            color: var(--premium-charcoal);
            font-size: 16px !important; /* iOS 사파리 강제 줌인 버그 방어 */
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem;
            width: 100%;
            height: 4.25rem; 
            padding-top: 1.7rem !important; 
            padding-bottom: 0.5rem !important;
            padding-left: 3.25rem !important;
            padding-right: 1rem !important;
        }
        
        .premium-input:focus {
            background: #ffffff;
            border-color: var(--premium-charcoal);
            outline: none;
            transform: translateY(-1px);
        }
        
        .premium-input.input-error {
            border-color: var(--sinjeon-pink) !important;
            background-color: #FEF2F2 !important; 
            box-shadow: 0 0 0 4px rgba(227, 0, 15, 0.15), inset 0 2px 4px 0 rgba(227, 0, 15, 0.05) !important;
        }
        .premium-input.input-error ~ .floating-label { color: var(--sinjeon-pink) !important; }
        .premium-input.input-error ~ .input-icon { color: var(--sinjeon-pink) !important; }

        .premium-input::placeholder { color: transparent; }
        .input-icon { transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; }
        .premium-input:focus ~ .input-icon { color: var(--premium-charcoal); }

        /* 🌟 [가속 9] 브라우저 자동완성 오염 방지 하얀색 덮어쓰기 */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #111827 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 🌟 [그래픽 4] 플로팅 레이블 Inner-안착 아키텍처 */
        .floating-label-group { position: relative; }
        .floating-label {
            position: absolute;
            left: 3.25rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 14px;
            color: #64748b;
            pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            letter-spacing: 0.03em;
            z-index: 10;
            margin: 0;
        }
        
        .premium-input:focus ~ .floating-label,
        .premium-input:not(:placeholder-shown) ~ .floating-label {
            top: 15px; 
            transform: translateY(-50%) scale(0.75);
            transform-origin: left center;
            color: #94a3b8;
            background: transparent; 
            padding: 0;
            border: none;
            box-shadow: none;
        }
        .premium-input:focus ~ .floating-label { color: var(--premium-charcoal); }

        /* 🌟 [그래픽 5] 3D 마그네틱 SECURE LOGIN 버튼 */
        .btn-hip {
            background: linear-gradient(135deg, var(--sinjeon-pink) 0%, #A3000B 100%);
            color: #ffffff;
            border: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-hip::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transition: none;
        }
        .btn-hip:hover:not(:disabled) {
            transform: translateY(-3px);
            letter-spacing: 0.25em; 
        }
        .btn-hip:hover:not(:disabled):after {
            left: 200%;
            transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hip:active:not(:disabled) { 
            transform: translateY(1px) scale(0.98); 
            box-shadow: 0 2px 10px rgba(227, 0, 15, 0.2); 
        }

        .text-glow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05); }
        .text-glow-red { text-shadow: 0 2px 15px rgba(227, 0, 15, 0.2); }
        ::-webkit-scrollbar { display: none; }

        /* 🌟 시네마틱 등장 애니메이션 */
        .cinematic-enter { 
            animation: fadeUpCinematic 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; 
            will-change: opacity, transform; 
        }
        .delay-100 { animation-delay: 0.1s; } 
        @keyframes fadeUpCinematic { 
            0% { opacity: 0; transform: translateY(20px) translateZ(0); }
            100% { opacity: 1; transform: translateY(0) translateZ(0); } 
        }

        /* 🌟 폼 증발 절대 방어 록다운 */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0) translateZ(0); opacity: 1 !important; }
            20% { transform: translateX(-8px) translateZ(0); opacity: 1 !important; }
            40% { transform: translateX(8px) translateZ(0); opacity: 1 !important; }
            60% { transform: translateX(-4px) translateZ(0); opacity: 1 !important; }
            80% { transform: translateX(4px) translateZ(0); opacity: 1 !important; }
        }
        .shake-animation { animation: error-shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important; }

        /* 🌟 Caps Lock 아코디언 */
        .alert-slide { 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            opacity: 0; 
            max-height: 0; 
            overflow: hidden; 
            margin-top: 0;
            padding-left: 0.5rem;
        }
        .alert-slide.active { opacity: 1; max-height: 30px; margin-top: 8px; }
    </style>
</head>

<body id="mainBody" class="flex items-center justify-center p-4 sm:p-6 overflow-hidden relative selection:bg-[#E3000F] selection:text-white" style="opacity: 0; transition: opacity 0.5s ease-out;">

    <!-- 🌟 [보안 2] 제로 레이턴시 라우팅 (Zero-Latency Routing) -->
    <!-- auth.js가 로딩되기도 전에, 기존 세션이 유효하면 0초 만에 대시보드로 강제 우회시킵니다. -->
    <script>
        (function() {
            try {
                var _sysRole = String(localStorage.getItem("y2c_role") || "").toUpperCase().trim();
                var _sysToken = String(localStorage.getItem("y2c_token") || "").trim();
                
                if (_sysRole && _sysRole !== "NULL" && _sysToken && _sysToken.length > 10) {
                    if (_sysRole === "VENDOR" || _sysRole === "MASTER") { window.location.replace("admin.html"); } 
                    else if (_sysRole === "PARTNER") { window.location.replace("dashboard.html"); } 
                    else { window.location.replace("items.html"); }
                } else {
                    const keysToClear = ["y2c_token", "y2c_role", "y2c_client", "y2c_id", "y2c_premium_state", "y2c_region"];
                    keysToClear.forEach(function(k) { localStorage.removeItem(k); });
                }
            } catch (e) { console.error("[Y2C Boot Init]", e); }
        })();
    </script>

    <noscript>

    <!-- 🌟 auth.js 가 렌더링할 애플 스타일 토스트 컨테이너의 타겟 지점 -->
    <div id="premiumToastContainer"></div>

    <main class="w-full max-w-[440px] z-10 block relative mt-4 sm:mt-0 cinematic-enter">
        
        <header class="text-center mb-8 block w-full relative z-20">
            
            <!-- 🌟 [그래픽 8] 로고 샌드박스 (404 에러 원천 차단용 벡토릭 디자인 유지 및 Shimmer 효과 추가) -->

            <div class="space-y-6">
                
                <!-- 🌟 [UI 픽스 1] 플로팅 레이블 타이핑 겹침 100% 소거 ID Input -->

                    <div class="relative flex items-center">
                        <span class="input-icon absolute left-4 pointer-events-none z-10 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" name="userId" autocomplete="username" spellcheck="false" placeholder=" " class="premium-input shadow-premium-input focus:shadow-premium-input-focus font-mono tracking-wider relative z-0">
                        <label for="userId" class="floating-label">Partner / Vendor ID</label>
                    </div>
                </div>

                <!-- 🌟 [UI 픽스 1] 플로팅 레이블 타이핑 겹침 100% 소거 PW Input -->
                <div class="floating-label-group">
                    <div class="relative flex items-center">
                        <span class="input-icon absolute left-4 pointer-events-none z-10 flex items-center justify-center">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="userPw" name="userPw" autocomplete="current-password" placeholder=" " class="premium-input shadow-premium-input focus:shadow-premium-input-focus font-mono tracking-[0.3em] text-lg relative z-0">
                        <label for="userPw" class="floating-label">Passkey</label>
                        
                        <!-- 비밀번호 가시성 토글 아이콘 (자체 UI 컨트롤) -->
                        <button type="button" id="togglePwBtn" class="absolute right-4 text-gray-400 hover:text-[var(--premium-charcoal)] transition-colors focus:outline-none z-10 p-1">
                            <svg id="eyeIconClosed" class="w-5 h-5 block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path></svg>
                            <svg id="eyeIconOpen" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- 🌟 Caps Lock 감지 유체 아코디언 모션 -->
                <div id="capsLockWarning" role="alert" class="alert-slide flex items-center gap-1.5 text-[11px] font-bold text-[#E3000F]">
                    <svg class="w-3.5 h-3.5 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    Caps Lock is ON
                </div>

                <!-- 🌟 Biometric UI Hint -->
                <div class="flex justify-between items-center px-1 mt-1 mb-2 hidden sm:flex opacity-60">
                    <span class="text-[9px] text-gray-400 font-bold tracking-widest uppercase">Secure Auth Level 4</span>
                    <svg class="w-4 h-4 text-gray-400 animate-heartbeat" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                </div>

                <!-- 🌟 3D 마그네틱 SECURE LOGIN 버튼 (auth.js가 로딩 스피너 및 disabled 상태를 실시간 컨트롤) -->
                <button type="submit" id="loginBtn" class="btn-hip shadow-premium-btn hover:shadow-premium-btn-hover w-full font-montserrat font-black text-[13.5px] tracking-[0.2em] uppercase py-5 rounded-xl mt-3 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-[#E3000F] focus:ring-offset-2 focus:ring-offset-[#ffffff]">

                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>

            <footer class="mt-10 text-center border-t border-gray-100 pt-6 space-y-2">

                <div class="flex items-center justify-center gap-2">
                    <p class="font-montserrat text-[8.5px] font-black text-emerald-600 tracking-[0.2em] uppercase flex items-center justify-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> System V40.66 Enterprise
                    </p>
                    <span class="text-gray-300 text-[8px]">|</span>
                    <p id="networkStatusPill" class="font-montserrat text-[8px] font-bold text-gray-400 tracking-[0.1em] uppercase transition-colors duration-300">

    </main>

<!-- 🚨 [아키텍처 모듈 융합] config.js와 auth.js를 로드하여 모든 백엔드 통신 로직을 코어 엔진에 100% 위임 -->
<script src="assets/js/config.js"></script>
<script src="assets/js/auth.js"></script>

<script>
/**
 * 🌟 V40.66 Enterprise Ultimate Presentation Engine
 * UI/DOM 제어만 담당하며, 무거운 백엔드 통신 및 인증 록다운은 auth.js (Y2C_AuthEngine)에 100% 위임합니다.
 * 이를 통해 렌더링 블로킹(Blocking)을 차단하고 제로 레이턴시(Zero-Latency)를 달성합니다.
 */
document.addEventListener("DOMContentLoaded", () => {
    
    // 1. 시간에 따른 동적 인사말 마이크로 카피 (UI 전용)
    const greetingEl = document.getElementById('dynamicGreeting');
    if (greetingEl) {
        const hour = new Date().getHours();
        if (hour >= 5 && hour < 12) greetingEl.innerText = "Good Morning, Partner";
        else if (hour >= 12 && hour < 18) greetingEl.innerText = "Good Afternoon, Partner";
        else greetingEl.innerText = "Good Evening, Partner";
    }

    // 2. 패스워드 가시성 토글 (네이티브 DOM 제어)
    const pwInput = document.getElementById("userPw");
    const togglePwBtn = document.getElementById('togglePwBtn');
    const eyeOpen = document.getElementById('eyeIconOpen');
    const eyeClosed = document.getElementById('eyeIconClosed');
    
    if(togglePwBtn && pwInput) {
        togglePwBtn.addEventListener('click', () => {
            if(pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeClosed.classList.add('hidden');
                eyeOpen.classList.remove('hidden');
            } else {
                pwInput.type = 'password';
                eyeOpen.classList.add('hidden');
                eyeClosed.classList.remove('hidden');
            }
        });
    }

    // 3. Caps Lock 경고 UI 작동
    const capsLockWarning = document.getElementById("capsLockWarning");
    if (pwInput && capsLockWarning) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { 
                capsLockWarning.classList.add('active'); 
            } else { 
                capsLockWarning.classList.remove('active'); 
            }
        });
        pwInput.addEventListener('blur', () => { capsLockWarning.classList.remove('active'); });
    }

    // 4. 🌟 [핵심] auth.js 코어 모듈 100% 다이렉트 바인딩
    // index.html 내부에는 복잡한 fetch 통신 코드가 단 한 줄도 존재하지 않습니다.
    if (typeof Y2C_AuthEngine !== 'undefined') {
        Y2C_AuthEngine.bindLoginForm('loginForm');
    } else {
        console.error("CRITICAL ERROR: Y2C_AuthEngine is not loaded. Please ensure auth.js is correctly linked.");
        const container = document.getElementById('premiumToastContainer');
        if (container) {
            container.innerHTML = `<div class="bg-white/95 backdrop-blur-md border border-gray-200 border-l-4 border-l-[#E3000F] text-[#111827] p-4 rounded-xl shadow-lg flex items-center gap-3 font-bold text-[13.5px]"><span class="text-[#E3000F]">⚠️ 보안 통신 모듈(auth.js)을 불러올 수 없습니다. 서버 상태를 확인하십시오.</span></div>`;
        }
    }
});
</script>
