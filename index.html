<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1A1516">
  <title>Login | Advisory Master System</title>
  <link rel="icon" type="image/png" href="favicon.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --sinjeon-pink: #E84C60; --premium-charcoal: #1A1516; }
    body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    /* 자동완성 배경색 커스텀 */
    input:-webkit-autofill { -webkit-box-shadow: 0 0 0 30px white inset !important; -webkit-text-fill-color: #1A1516 !important; }
  </style>
</head>
<body class="bg-[#F8F6F6] min-h-screen flex selection:bg-[#E84C60] selection:text-white overflow-hidden">
  
  <!-- 좌측: 브랜드 비주얼 영역 -->
  <div class="hidden lg:flex lg:w-1/2 bg-[var(--premium-charcoal)] relative flex-col justify-center px-16 xl:px-24">
    <!-- 배경 장식 -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
      <div class="absolute -top-40 -left-40 w-96 h-96 bg-[#E84C60] rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob"></div>
      <div class="absolute top-40 -right-20 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-10 animate-blob animation-delay-2000"></div>
    </div>
    
    <div class="relative z-10 w-full max-w-lg">
      <div class="flex items-center gap-6 mb-16">
        <!-- 🌟 404 에러 방어: 이미지가 없을 경우 대체 경로 시도 -->
        <img src="assets/images/Sinjeon_Logo_Pink.png" onerror="this.onerror=null; this.src='Sinjeon_Logo_Pink.png';" alt="Sinjeon Logo" class="h-14 object-contain">
        <div class="h-10 w-px bg-white/20"></div>
        <img src="assets/images/y2c_holdings_logo.png" onerror="this.onerror=null; this.src='y2c_holdings_logo.png';" alt="Y2C Logo" class="h-10 object-contain bg-white rounded-lg p-1.5">
      </div>
      
      <span class="inline-block border border-white/20 text-white/70 text-[10px] font-black uppercase tracking-[0.2em] px-4 py-1.5 rounded-full mb-6 bg-white/5 backdrop-blur-sm">
        Premium Franchise Portal
      </span>
      
      <h1 class="text-5xl xl:text-6xl font-black text-white leading-[1.1] tracking-tight mb-6">
        Advisory<br>Master System
      </h1>
      
      <p class="text-base text-gray-400 font-medium leading-relaxed max-w-sm tracking-wide">
        Integrated operational intelligence and supply chain management for exclusive Canadian partners.
      </p>
    </div>
  </div>

  <!-- 우측: 로그인 폼 영역 -->
  <div class="w-full lg:w-1/2 flex items-center justify-center p-6 sm:p-12 relative z-10">
    <div class="w-full max-w-md bg-white p-10 sm:p-14 rounded-[2.5rem] shadow-[0_20px_60px_-15px_rgba(0,0,0,0.05)] border border-gray-100">
      
      <div class="mb-10 text-center lg:text-left">
        <h2 class="text-3xl font-black text-[var(--premium-charcoal)] mb-3 tracking-tight">Welcome Back</h2>
        <p class="text-sm font-bold text-gray-400 tracking-wide">Please enter your master or partner credentials.</p>
      </div>

      <!-- 🌟 정확한 ID 체계가 부여된 로그인 폼 -->
      <form id="loginForm" class="space-y-6">
        
        <div class="space-y-2">
          <label for="userId" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.15em] ml-1">Partner ID</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <input type="text" id="userId" required autocomplete="username"
              class="block w-full pl-11 pr-4 py-4 bg-gray-50/50 border-2 border-gray-100 rounded-2xl text-[14px] font-bold text-[var(--premium-charcoal)] placeholder-gray-300 focus:bg-white focus:border-[#E84C60] focus:ring-4 focus:ring-[#E84C60]/10 transition-all outline-none" 
              placeholder="admin">
          </div>
        </div>

        <div class="space-y-2">
          <label for="userPw" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.15em] ml-1">Password</label>
          <div class="relative">
            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
              <svg class="h-5 w-5 text-gray-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
              </svg>
            </div>
            <input type="password" id="userPw" required autocomplete="current-password"
              class="block w-full pl-11 pr-4 py-4 bg-gray-50/50 border-2 border-gray-100 rounded-2xl text-[14px] font-bold text-[var(--premium-charcoal)] placeholder-gray-300 focus:bg-white focus:border-[#E84C60] focus:ring-4 focus:ring-[#E84C60]/10 transition-all outline-none" 
              placeholder="••••••••">
          </div>
        </div>

        <!-- 🌟 자바스크립트가 컨트롤할 에러 메시지 영역 -->
        <div id="errorMessage" class="hidden bg-[#C23347]/10 border border-[#C23347]/20 text-[#C23347] text-[12px] font-bold px-4 py-3.5 rounded-xl text-center flex items-center justify-center gap-2 tracking-wide">
          <span>⚠️</span> <span id="errorText">Connection failed. Please try again.</span>
        </div>

        <button type="submit" id="submitBtn" 
          class="w-full bg-[#E84C60] hover:bg-[#C23347] text-white font-black py-4.5 rounded-2xl shadow-[0_10px_20px_-10px_rgba(232,76,96,0.6)] transition-all active:scale-[0.98] mt-2 text-[13px] tracking-[0.1em] uppercase h-[56px]">
          Sign In to Portal
        </button>
      </form>
      
      <!-- Footer Info -->
      <div class="mt-12 text-center">
        <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase">
          Y2C Holdings Inc. &copy; 2026
        </p>
      </div>

    </div>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
