<!DOCTYPE html>
<!-- 🌟 V40.22 Enterprise Master STABLE - HTML/JS/GS 100% Compatibility & 11 Bug Fixes -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#111827">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>SINJEON CANADA | Enterprise Portal</title>
    
    <!-- 🚨 프리로드: 폰트와 파비콘을 브라우저 렌더링 1순위로 강제 -->
    <link rel="preload" href="favicon.png" as="image" type="image/png" fetchpriority="high">
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <!-- 🌟 [방어 1] FOUC Absolute Fail-Safe (하얀 화면 먹통 원천 방지) -->
    <style>
        .fouc-lock { opacity: 0 !important; visibility: hidden !important; }
    </style>
    <script>
        document.documentElement.classList.add('fouc-lock');
        window._foucTimer = setTimeout(function() {
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            document.body.style.opacity = '1';
        }, 800);
    </script>

    <!-- 🚨 Tailwind CSS 동기식 로드 보장 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Config 파이프라인 (V40.21 연동 보장) -->
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal absolute fallback.')"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'], 
                        montserrat: ['Montserrat', 'sans-serif'],
                        mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'monospace'] 
                    },
                    colors: { premium: { charcoal: '#111827', red: '#E3000F', hover: '#B9000C' } }
                }
            }
        }
    </script>

    <style>
        :root {
            --sinjeon-pink: #E3000F; 
            --sinjeon-vibrant: #FF3B5C;
            --premium-bg: #111827; 
        }
        
        /* 🌟 [방어 8] 터치 딜레이 및 바운스 스크롤 원천 차단 */
        html, body { 
            overscroll-behavior-y: none; touch-action: manipulation; 
            background-color: var(--premium-bg) !important; color: #ffffff; 
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; min-height: 100vh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; 
        }

        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .solid-panel {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            border-radius: 2rem;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            transform: translateZ(0); 
        }
        
        /* 🌟 [방어 3] 16px 강제 지정으로 iOS 사파리 줌인 버그 완벽 차단 */
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
            font-size: 16px !important; 
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem;
        }
        .premium-input:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: var(--sinjeon-pink);
            box-shadow: 0 0 0 4px rgba(227, 0, 15, 0.15);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.2); font-weight: 500; font-family: 'Inter', sans-serif; }
        
        /* 🌟 [방어 6] 브라우저 자동완성 노란색/파란색 배경 덮어쓰기 무효화 */
        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #111827 inset !important;
            -webkit-text-fill-color: white !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .btn-hip {
            background: #ffffff;
            color: var(--premium-bg);
            border: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-hip:hover:not(:disabled) {
            background: var(--sinjeon-pink);
            color: #ffffff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 25px rgba(227, 0, 15, 0.4);
            letter-spacing: 0.25em;
        }
        .btn-hip:active:not(:disabled) { transform: translateY(1px) scale(0.98); }

        .text-glow { text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .text-glow-red { text-shadow: 0 0 20px rgba(227, 0, 15, 0.5); }
        
        .alert-slide { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; max-height: 0; overflow: hidden; }
        .alert-slide.active { opacity: 1; max-height: 40px; margin-top: 8px; }
        
        ::-webkit-scrollbar { display: none; }

        .cinematic-enter { opacity: 0; transform: translateY(20px) translateZ(0); animation: fadeUpCinematic 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; will-change: opacity, transform; }
        .delay-100 { animation-delay: 0.1s; } .delay-200 { animation-delay: 0.2s; }
        @keyframes fadeUpCinematic { to { opacity: 1; transform: translateY(0) translateZ(0); } }

        /* 🌟 [방어 10] 에러 셰이크 애니메이션 하드웨어 가속 보장 */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0) translateZ(0); }
            20% { transform: translateX(-8px) translateZ(0); }
            40% { transform: translateX(8px) translateZ(0); }
            60% { transform: translateX(-4px) translateZ(0); }
            80% { transform: translateX(4px) translateZ(0); }
        }
        .shake-animation { animation: error-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>

<body id="mainBody" style="background-color: #111827; margin: 0; opacity: 0; transition: opacity 0.5s ease-out;" class="flex items-center justify-center p-5 relative selection:bg-[#E3000F] selection:text-white">

    <!-- 🌟 Clickjacking 방어 & [방어 11] NoScript 샌드박스 -->
    <script>if (window.top !== window.self) { window.top.location.href = window.self.location.href; }</script>
    <noscript>
        <div style="position:fixed; top:0; left:0; width:100%; height:100%; background:#E3000F; color:#fff; display:flex; align-items:center; justify-content:center; z-index:99999; font-weight:bold; font-size:18px; font-family:sans-serif; flex-direction:column;">
            <span>JavaScript is Disabled</span>
            <span style="font-size:14px; margin-top:10px; opacity:0.8;">Please enable JavaScript to access the Enterprise Portal.</span>
        </div>
    </noscript>

    <main class="w-full max-w-[420px] z-10 block relative mt-10 sm:mt-0 cinematic-enter">
        
        <header class="text-center mb-10 block w-full">
            <div class="flex items-center justify-center gap-6 mb-6">
                <!-- 🌟 [방어 4] OOM 유발 Favicon 404 무한 루프 록다운 -->
                <img src="favicon.png" style="max-height: 80px; width: auto; max-width: 120px; display: block;" fetchpriority="high" decoding="async" onerror="this.onerror=null; this.src='assets/images/favicon.png';" alt="Sinjeon Logo" class="object-contain drop-shadow-2xl z-10">
                <div class="h-12 w-[1px] bg-white/20"></div>
                <img src="y2c_holdings_logo.png" style="max-height: 96px; width: auto; max-width: 120px; display: block;" decoding="async" onerror="this.style.display='none';" alt="Y2C Holdings Logo" class="object-contain drop-shadow-2xl rounded-full bg-white/5 p-2 border border-white/10 z-10">
            </div>
            
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-white tracking-tighter uppercase text-glow">SINJEON</span>
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-[#E3000F] tracking-tight uppercase text-glow-red">CANADA</span>
            </div>
            
            <div class="flex items-center justify-center gap-3 mt-3 opacity-70">
                <span class="w-10 h-[1px] bg-gray-400"></span>
                <span class="font-montserrat text-[9px] sm:text-[10px] font-black text-gray-300 tracking-[0.3em] uppercase drop-shadow-md">Enterprise Portal</span>
                <span class="w-10 h-[1px] bg-gray-400"></span>
            </div>
        </header>

        <!-- 🌟 [방어 5] 엔터 키 이중 서밋 네이티브 방어망 (onsubmit="return false;") -->
        <form id="loginForm" class="solid-panel p-7 sm:p-10 w-full relative z-20 cinematic-enter delay-100" autocomplete="off" onsubmit="return false;">
            <div class="space-y-6">
                
                <div>
                    <label for="userId" class="block font-montserrat text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Partner / Vendor ID</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" name="userId" autocomplete="username" spellcheck="false" placeholder="Enter Authorized ID" class="premium-input w-full py-4 pl-12 pr-4 font-mono font-bold tracking-wider">
                    </div>
                </div>

                <div>
                    <label for="userPw" class="block font-montserrat text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Passkey</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="userPw" name="userPw" autocomplete="current-password" placeholder="••••••••" class="premium-input w-full py-4 pl-12 pr-4 font-mono font-black tracking-[0.3em] text-lg">
                    </div>
                    
                    <div id="capsLockWarning" role="alert" class="alert-slide flex items-center gap-1.5 text-[11px] font-bold text-[var(--sinjeon-vibrant)] ml-1 mt-2 font-inter">
                        <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Caps Lock is ON
                    </div>
                </div>

                <div id="loginErrorMsg" role="alert" aria-live="assertive" class="text-center text-[11px] sm:text-[12px] font-bold tracking-wide min-h-[20px] flex items-center justify-center break-keep font-inter text-[var(--sinjeon-vibrant)] hidden"></div>

                <button type="submit" id="loginBtn" class="btn-hip w-full font-montserrat font-black text-[13px] tracking-[0.2em] uppercase py-4.5 rounded-xl mt-2 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-[#E3000F] focus:ring-offset-2 focus:ring-offset-[#111827]">
                    Secure Login
                </button>
            </div>
            
            <footer class="mt-8 text-center border-t border-white/5 pt-6">
                <p class="font-montserrat text-[8px] sm:text-[9px] font-bold text-gray-500 tracking-widest uppercase opacity-70">
                    Operated by Y2C Holdings Ltd.<br>
                    <span class="text-gray-400 font-black mt-1 inline-block">System V40.22 Enterprise Stable</span>
                </p>
            </footer>
        </form>
    </main>

<script>
/**
 * 🌟 V40.22 Enterprise Auth Gateway
 * [11 Bug Fixes] FOUC Release, Flash Prevention, Double Submit Defense
 */

// 🌟 [방어 7] Config 캐시 증발 대비 인라인 폴백 & 마스터 URL 강제 주입
const CONFIG = (typeof window.SYSTEM_CONFIG !== 'undefined') ? window.SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbyPWfrhETBWY1ThDwiNnTxL9h7-0zduGiYL2W0oLoNPeHNaNfYqZLft7SNWmKooDHFfhQ/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client" }
};
const TARGET_API_URL = (CONFIG.API && CONFIG.API.BASE_URL) ? CONFIG.API.BASE_URL : "https://script.google.com/macros/s/AKfycbyPWfrhETBWY1ThDwiNnTxL9h7-0zduGiYL2W0oLoNPeHNaNfYqZLft7SNWmKooDHFfhQ/exec";

function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", () => {
    
    // 🌟 [방어 2, 9] 기 로그인 사용자 Flash 깜빡임 차단 및 null 스트링 록다운
    try {
        const sessionToken = String(localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN) || "").trim();
        const userRole = String(localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE) || "").toUpperCase().trim();
        
        if (sessionToken && sessionToken !== "null" && sessionToken.length > 10 && userRole && userRole !== "NULL") {
            setTimeout(() => {
                if (userRole === "VENDOR" || userRole === "MASTER") { window.location.replace("admin.html"); } 
                else if (userRole === "PARTNER") { window.location.replace("dashboard.html"); } 
                else { window.location.replace("items.html"); }
            }, 50);
            return; // 렌더링 중단
        } else {
            const keysToClear = [CONFIG.STORAGE_KEYS.USER_TOKEN, CONFIG.STORAGE_KEYS.ROLE, CONFIG.STORAGE_KEYS.CLIENT_NAME, 'y2c_id', 'y2c_premium_state'];
            keysToClear.forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
        }
    } catch (e) { console.error("[Y2C Storage Error]", e); }

    // 권한 검증을 통과한 경우에만 화면 표시 (FOUC 락 해제)
    try {
        clearTimeout(window._foucTimer);
        document.documentElement.classList.remove("fouc-lock");
        document.documentElement.style.opacity = "1";
        document.documentElement.style.visibility = "visible";
        document.getElementById('mainBody').style.opacity = "1";
    } catch(e) {}

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;
    let authTimeoutFallback = null;

    window.addEventListener('offline', () => { 
        if(errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ 인터넷 연결이 끊어졌습니다.</span>`; }
    });
    window.addEventListener('online', () => { 
        if(errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-emerald-400">✅ 네트워크가 복구되었습니다.</span>`; }
        isAuthenticating = false; resetLoginButton();
    });

    window.addEventListener('unhandledrejection', function(event) {
        console.error("[Y2C Telemetry Promise Rejection]", event.reason);
        if (isAuthenticating) {
            isAuthenticating = false;
            if (errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">통신 중 시스템 예외가 발생했습니다.</span>`; }
            resetLoginButton(); triggerShake();
        }
    });

    [idInput, pwInput].forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => { setTimeout(() => { window.scrollTo({ top: 80, behavior: 'smooth' }); }, 300); });
    });

    if (pwInput && capsLockWarning) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
            else { capsLockWarning.classList.remove('active'); }
        });
        pwInput.addEventListener('blur', () => { capsLockWarning.classList.remove('active'); });
    }

    function triggerShake() {
        if (!loginForm) return;
        loginForm.classList.remove('shake-animation');
        void loginForm.offsetWidth;
        loginForm.classList.add('shake-animation');
    }

    const originalBtnText = loginBtn ? loginBtn.innerHTML : "Secure Login";
    function resetLoginButton() {
        if (loginBtn) {
            loginBtn.disabled = false; 
            loginBtn.innerHTML = originalBtnText; 
            loginBtn.style.background = ""; 
            loginBtn.style.color = "";
            loginBtn.style.border = "";
            loginBtn.style.letterSpacing = "";
            loginBtn.classList.remove('cursor-not-allowed', 'pointer-events-none');
        }
    }

    async function executeLogin(payload, retries = 2) {
        if (!navigator.onLine) throw new Error("네트워크(Wi-Fi/데이터)가 끊어졌습니다.");
        const safePayload = (typeof payload === 'object' && payload !== null && !Array.isArray(payload)) ? payload : {};
        let lastNetworkError;

        for (let i = 0; i <= retries; i++) {
            let controller = new AbortController();
            let timeoutId = setTimeout(() => controller.abort(), 15000); 

            try {
                const response = await fetch(TARGET_API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...safePayload }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    if (response.status === 404 || response.status === 401 || response.status === 403) {
                        const explicitError = new Error(`서버 엔드포인트 접근이 거부되었습니다 (HTTP ${response.status})`);
                        explicitError.httpStatus = response.status;
                        explicitError.isFatal = true;
                        throw explicitError;
                    }
                    const httpError = new Error(`HTTP ${response.status}`);
                    httpError.httpStatus = response.status;
                    throw httpError;
                }

                const rawText = await response.text();
                
                let jsonResult;
                try { jsonResult = JSON.parse(rawText); } 
                catch (parseErr) { throw new Error("서버 응답 포맷 파싱 실패. 배포 설정을 확인하세요."); }

                if (!jsonResult || typeof jsonResult !== 'object' || Array.isArray(jsonResult)) {
                    throw new Error("서버 응답 규격 무결성 훼손.");
                }

                return jsonResult;
            } catch (err) {
                lastNetworkError = err;
                
                if (err.isFatal) throw err;
                
                if (err && err.httpStatus) {
                    if (err.httpStatus === 429) throw new Error("서버 접속 대기열 초과 (HTTP 429). 잠시 후 시도하세요.");
                    if (err.httpStatus === 503) throw new Error("서버 일시적 점검 중 (HTTP 503).");
                }
                
                if (err.message && err.message.includes("Failed to fetch")) {
                    lastNetworkError = new Error("🚨 구글 서버 접근 차단됨(CORS).<br><span class='text-[10px] text-gray-400 mt-1 block font-inter'>배포 권한이 '모든 사용자'로 설정되었는지 확인하세요.</span>");
                }

                if (i < retries) {
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="animate-pulse text-amber-400 font-inter">보안 통신망 재시도 중... (${i+1}/3)</span>`; }
                    await new Promise(res => setTimeout(res, waitTime));
                }
            } finally {
                clearTimeout(timeoutId);
                controller = null;
            }
        }
        throw new Error(lastNetworkError?.name === 'AbortError' ? "서버 응답 시간 초과 (15초 지연).<br><span class='text-[10px] text-gray-400 font-inter'>인터넷 상태나 구글 서버 동기화를 확인하세요.</span>" : (lastNetworkError?.message || "보안 서버 통신 실패."));
    }

    if (loginForm) { 
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault(); 
            if (isAuthenticating) return;

            const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
            const pw = pwInput ? String(pwInput.value).trim() : "";

            if (!id || !pw) {
                if(errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">ID와 Passkey를 모두 입력해주세요.</span>`; }
                triggerShake();
                return;
            }

            isAuthenticating = true;
            
            clearTimeout(authTimeoutFallback);
            authTimeoutFallback = setTimeout(() => {
                if(isAuthenticating) {
                    isAuthenticating = false;
                    resetLoginButton();
                    if(errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">시스템 렌더링 시간이 초과되었습니다. 다시 시도해 주세요.</span>`; }
                }
            }, 20000);

            if (loginBtn) {
                loginBtn.disabled = true;
                loginBtn.style.background = "rgba(255, 255, 255, 0.05)";
                loginBtn.style.color = "var(--sinjeon-pink)";
                loginBtn.style.border = "1px solid var(--sinjeon-pink)";
                loginBtn.style.letterSpacing = "0.1em";
                loginBtn.classList.add('cursor-not-allowed', 'pointer-events-none');
                loginBtn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-[var(--sinjeon-pink)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING</span>`;
            }
            if (errorMsg) errorMsg.classList.add('hidden');

            let loginResult = null; 
            let isSuccessRedirecting = false;

            try {
                loginResult = await executeLogin({ id: id, pw: pw });

                if (loginResult && loginResult.success) {
                    if (errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-emerald-400 font-bold drop-shadow-md font-inter">✅ SECURE SESSION ESTABLISHED</span>`; }
                    
                    try {
                        const keysToClear = [CONFIG.STORAGE_KEYS.USER_TOKEN, CONFIG.STORAGE_KEYS.ROLE, CONFIG.STORAGE_KEYS.CLIENT_NAME, 'y2c_id', 'y2c_premium_state'];
                        keysToClear.forEach(k => { try { localStorage.removeItem(k); } catch(e){} });

                        localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, loginResult.token);
                        localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, loginResult.role);
                        localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, loginResult.clientName);
                        localStorage.setItem("y2c_id", id);
                        localStorage.setItem("y2c_premium_state", loginResult.clientState || "DEFAULT");
                        
                        isSuccessRedirecting = true;
                    } catch(stErr) { 
                        throw new Error("로컬 스토리지 할당 실패: 기기 용량을 확인하거나 시크릿 모드를 해제하세요."); 
                    }

                    if (loginForm) { 
                        loginForm.style.transition = "opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1)"; 
                        loginForm.style.opacity = "0"; 
                        loginForm.style.pointerEvents = "none"; 
                    }
                    
                    clearTimeout(authTimeoutFallback);
                    
                    setTimeout(() => {
                        const targetRole = String(loginResult.role).toUpperCase();
                        if (targetRole === "MASTER" || targetRole === "VENDOR") {
                            window.location.replace("admin.html");
                        } else if (targetRole === "PARTNER") {
                            window.location.replace("dashboard.html");
                        } else {
                            window.location.replace("items.html");
                        }
                    }, 500);

                } else {
                    if (errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ ${escapeHtml(loginResult?.message || "보안 인증이 거부되었습니다.")}</span>`; }
                    triggerShake(); 
                }
            } catch (err) {
                if (errorMsg) { errorMsg.classList.remove('hidden'); errorMsg.innerHTML = `<span class="text-[#FF3B5C]">${err.message}</span>`; }
                triggerShake(); 
            } finally {
                clearTimeout(authTimeoutFallback);
                if (!isSuccessRedirecting) {
                    isAuthenticating = false;
                    resetLoginButton();
                }
            }
        }); 
    }
});
</script>
</body>
</html>
