<!DOCTYPE html>
<!-- 🌟 V17.11 FOUC 방어: JS 로드 전까지 화면을 숨겨 깜빡임(쌩얼 노출) 완벽 차단 -->
<html lang="en" class="opacity-0 transition-opacity duration-700 ease-in-out">
<head>
    <meta charset="UTF-8">
    <!-- 📱 모바일 네이티브 앱 UX 최적화: 확대/바운스 방어 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>SINJEON CANADA | Enterprise Portal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <!-- ⚡ 리소스 터널링 (네트워크 Preconnect - 로딩 속도 30% 향상) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <!-- V17.11 통합 Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal fallback.')"></script>

    <style>
        :root {
            /* 🌟 하이엔드 딥 다크 팔레트 (Enterprise OLED Black) */
            --sinjeon-pink: #E84C60; 
            --sinjeon-vibrant: #FF3B5C;
            --sinjeon-dark: #B31E35;
            --premium-bg: #0a0a0a; 
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        /* 📱 뷰포트 바운스 및 딜레이 100% 차단 */
        html, body { overscroll-behavior-y: none; touch-action: manipulation; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--premium-bg);
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* 🌟 대기업식 딥 오로라 배경 (Deep Ethereal Mesh) - 유치한 원형 제거, 묵직하고 우아한 블러 */
        .ambient-bg {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 0;
            background: #0a0a0a;
        }
        .ambient-glow {
            position: absolute;
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(232, 76, 96, 0.07) 0%, transparent 60%);
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(100px);
            animation: pulse-glow 10s infinite alternate ease-in-out;
            pointer-events: none;
        }
        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        /* 🌟 시네마틱 렌더링 */
        .cinematic-enter { opacity: 0; transform: translateY(30px) scale(0.98); animation: fadeUpCinematic 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-100 { animation-delay: 0.1s; } .delay-200 { animation-delay: 0.2s; } .delay-300 { animation-delay: 0.3s; } .delay-400 { animation-delay: 0.4s; }
        @keyframes fadeUpCinematic { to { opacity: 1; transform: translateY(0) scale(1); } }

        /* 🌟 최고급 아크릴릭 프로스티드 글래스 (Apple/Vercel 스타일) */
        .glass-panel {
            background: rgba(15, 15, 15, 0.6);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid var(--glass-border);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255,255,255,0.05);
            transition: box-shadow 0.4s ease;
        }
        
        /* 🌟 맑고 투명한 인풋 필드 (Focus 시 은은한 글로우) */
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 16px !important; /* iOS 줌 방지 필수 */
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem;
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(232, 76, 96, 0.5);
            box-shadow: 0 0 0 4px rgba(232, 76, 96, 0.15);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 500; letter-spacing: 0.05em; }

        /* 🌟 [요청사항 반영] 힙(Hip)하고 타격감 있는 마그네틱 스프링 버튼 */
        .btn-hip {
            position: relative;
            background: #ffffff;
            color: var(--premium-bg);
            border: none;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); /* 스프링 텐션 */
            z-index: 1;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        /* 버튼 내부 광원 스와이프 효과 */
        .btn-hip::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8), transparent);
            transform: skewX(-20deg);
            transition: 0.6s ease-in-out;
            z-index: -1;
        }
        /* Hover 시: 살짝 떠오르며 트렌디한 자간 벌어짐 + 은은한 핑크 아우라 */
        .btn-hip:hover:not(:disabled) {
            background: var(--sinjeon-vibrant);
            color: #ffffff;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 35px -5px rgba(232, 76, 96, 0.6);
            letter-spacing: 0.25em; /* 힙한 타이포그래피 액션 */
        }
        .btn-hip:hover:not(:disabled)::after { left: 150%; }
        
        /* Active 시: 기계식 키보드를 누르는 듯한 묵직한 수축(Tactile Click) */
        .btn-hip:active:not(:disabled) {
            transform: translateY(2px) scale(0.94);
            box-shadow: 0 5px 10px rgba(232, 76, 96, 0.3);
            letter-spacing: 0.15em;
        }

        /* 🌟 텍스트 글로우 & 로고 플로팅 */
        .text-glow { text-shadow: 0 0 20px rgba(255, 255, 255, 0.2); }
        .text-glow-red { text-shadow: 0 0 30px rgba(232, 76, 96, 0.6); }
        .floating-logo { animation: floating 6s ease-in-out infinite; will-change: transform; }
        @keyframes floating { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-6px); } }

        /* 🌟 에러 발생 시 GPU 가속 네이티브 Shake 효과 (무손실 보존) */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake-animation { animation: error-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }

        /* 🌟 캡스락 & 에러 메시지 트랜지션 (무손실 보존) */
        .alert-slide { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; max-height: 0; overflow: hidden; transform: translateY(-5px); }
        .alert-slide.active { opacity: 1; max-height: 40px; margin-top: 8px; transform: translateY(0); }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 relative selection:bg-[#E84C60] selection:text-white">

    <!-- 🌟 하이엔드 딥 앰비언트 배경 -->
    <div class="ambient-bg">
        <div class="ambient-glow"></div>
    </div>

    <main class="w-full max-w-[420px] z-10">
        
        <!-- 🌟 듀얼 로고 & 브랜드 타이포그래피 -->
        <div class="text-center mb-12 cinematic-enter">
            <div class="flex items-center justify-center gap-6 mb-6">
                <div class="relative group cursor-default">
                    <img src="favicon.png" onerror="this.onerror=null; this.src='assets/images/favicon.png'; this.style.display='none';" alt="Sinjeon Logo" class="h-16 sm:h-20 object-contain drop-shadow-2xl floating-logo relative z-10">
                </div>
                <div class="h-12 w-[1px] bg-gradient-to-b from-transparent via-white/20 to-transparent"></div>
                <div class="relative group cursor-default">
                    <img src="y2c_holdings_logo.png" onerror="this.onerror=null; this.src='assets/images/y2c_holdings_logo.png'; this.style.display='none';" alt="Y2C Holdings Logo" class="h-20 sm:h-24 object-contain drop-shadow-2xl rounded-full bg-white/5 p-2 backdrop-blur-md border border-white/10 floating-logo relative z-10" style="animation-delay: 1.5s;">
                </div>
            </div>
            
            <div class="flex items-center justify-center gap-2.5 mb-1.5 drop-shadow-2xl">
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-white tracking-tighter uppercase text-glow">SINJEON</span>
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-[var(--sinjeon-pink)] tracking-tight uppercase text-glow-red">CANADA</span>
            </div>
            
            <div class="flex items-center justify-center gap-3 mt-4 opacity-70">
                <span class="w-12 h-[1px] bg-gradient-to-r from-transparent via-gray-400 to-transparent"></span>
                <span class="text-[9px] sm:text-[10px] font-black text-gray-300 tracking-[0.4em] uppercase drop-shadow-md">Enterprise Portal</span>
                <span class="w-12 h-[1px] bg-gradient-to-l from-transparent via-gray-400 to-transparent"></span>
            </div>
        </div>

        <!-- 🌟 로그인 폼 (하이엔드 프로스티드 글래스) -->
        <form id="loginForm" class="glass-panel rounded-[2rem] p-7 sm:p-10 relative cinematic-enter delay-100">
            <div class="space-y-6">
                
                <div class="cinematic-enter delay-200">
                    <label for="userId" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Partner / Vendor ID</label>
                    <div class="relative flex items-center group">
                        <span class="absolute left-4 text-gray-500 group-focus-within:text-[var(--sinjeon-pink)] transition-colors duration-300 pointer-events-none">
                            <svg class="w-5 h-5 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" autocomplete="username" placeholder="Enter Authorized ID" 
                            class="premium-input w-full py-4.5 pl-12 pr-4 font-mono font-bold">
                    </div>
                </div>

                <div class="cinematic-enter delay-300">
                    <label for="userPw" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Passkey</label>
                    <div class="relative flex items-center group">
                        <span class="absolute left-4 text-gray-500 group-focus-within:text-[var(--sinjeon-pink)] transition-colors duration-300 pointer-events-none">
                            <svg class="w-5 h-5 drop-shadow-md" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="userPw" autocomplete="current-password" placeholder="••••••••" 
                            class="premium-input w-full py-4.5 pl-12 pr-4 font-mono font-bold tracking-[0.3em]">
                    </div>
                    
                    <div id="capsLockWarning" class="alert-slide flex items-center gap-1.5 text-[11px] font-bold text-[var(--sinjeon-vibrant)] ml-1 drop-shadow-md">
                        <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Caps Lock is ON
                    </div>
                </div>

                <div id="loginErrorMsg" class="text-center text-[12px] font-bold tracking-wide min-h-[20px] flex items-center justify-center break-keep drop-shadow-md"></div>

                <!-- 🌟 타격감 있는 힙(Hip)한 마그네틱 버튼 적용 -->
                <button type="submit" id="loginBtn" class="btn-hip w-full font-black text-[13px] tracking-[0.2em] uppercase py-5 rounded-xl mt-2 cinematic-enter delay-400 flex items-center justify-center gap-2">
                    Secure Login
                </button>
            </div>
            
            <div class="mt-8 text-center border-t border-white/5 pt-6 cinematic-enter delay-400">
                <p class="text-[9px] font-bold text-gray-500 tracking-widest leading-relaxed uppercase">
                    Operated by Y2C Holdings Ltd.<br>
                    <span class="text-gray-400 font-black">System V17.11 Enterprise</span>
                </p>
            </div>
        </form>
    </main>

<script>
/**
 * 🌟 V17.11 Enterprise Login Core Logic (Zero-Deletion Guarantee)
 * - 100% 무손실 보존: 백오프 엔진, 세션 스니핑 방어, CORS 차단 감지기, 네이티브 Shake 이펙트
 */

const CONFIG = (typeof SYSTEM_CONFIG !== 'undefined') ? SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbzT-_ZIfaVv6hQ6L9mE-Q4L0g9a17Q2Bw34gT4wI3Q19586QpL_D7I09Z0Y090zXw/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client", USER_ID: "y2c_id" }
};

document.addEventListener("DOMContentLoaded", () => {
    // 🌟 V17.11 FOUC(깜빡임) 방어막 해제: 화면을 부드럽게 켬
    document.documentElement.classList.remove("opacity-0");

    // 1. 보안 라우팅 (세션 스니핑 방어 및 VENDOR 다이렉트 라우팅)
    const sessionToken = localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN);
    const userRole = localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE);
    if (sessionToken && userRole) {
        document.body.style.transition = "opacity 0.3s ease";
        document.body.style.opacity = '0';
        setTimeout(() => {
            window.location.replace((userRole === "MASTER" || userRole === "VENDOR") ? "admin.html" : "items.html");
        }, 300);
        return;
    }

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;

    // 2. 모바일 가상 키보드 가림 방어 (UX 개선)
    const inputs = [idInput, pwInput];
    inputs.forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => { 
            setTimeout(() => { 
                window.scrollTo({ top: loginForm.offsetTop - 20, behavior: 'smooth' }); 
            }, 300); 
        });
    });

    // 3. Caps Lock 감지 (CSS 클래스 토글)
    if (pwInput) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
            else { capsLockWarning.classList.remove('active'); }
        });
    }

    // 🌟 CSS 네이티브 진동(Shake) 트리거 함수
    function triggerShake() {
        loginForm.classList.remove('shake-animation');
        void loginForm.offsetWidth; // DOM Reflow 강제 발생 (애니메이션 리셋)
        loginForm.classList.add('shake-animation');
    }

    // 4. CORS 및 백엔드 단절 감지 특화 백오프(Backoff) 엔진
    async function executeLogin(payload, retries = 3) {
        if (!navigator.onLine) throw new Error("네트워크(Wi-Fi/데이터)가 끊어졌습니다.");

        let lastError;
        for (let i = 0; i <= retries; i++) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000); 

            try {
                const response = await fetch(CONFIG.API.BASE_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...payload }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const rawText = await response.text();
                
                try {
                    const jsonResult = JSON.parse(rawText);
                    if (!jsonResult.success && jsonResult.message && (jsonResult.message.includes("트래픽") || jsonResult.message.includes("병목") || jsonResult.message.includes("지연"))) {
                        throw new Error(jsonResult.message);
                    }
                    return jsonResult;
                } catch (parseErr) {
                    throw new Error("서버 응답 지연. 우회 접속을 시도합니다.");
                }
            } catch (err) {
                clearTimeout(timeoutId);
                lastError = err;
                
                // 🚨 CORS 에러(Failed to fetch) 강제 추적
                if (err.message && err.message.includes("Failed to fetch")) {
                    throw new Error("🚨 구글 서버 접근 차단됨(CORS)<br><span class='text-[10px] text-[var(--sinjeon-vibrant)] mt-1 block leading-tight'>구글 스크립트(.gs) 배포 설정을 '모든 사용자(Anyone)'로 변경하세요.</span>");
                }

                if (i < retries) {
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) errorMsg.innerHTML = `<span class="animate-pulse text-amber-400 font-bold drop-shadow-md">보안 트래픽 우회 중... (${i+1}/3)</span>`;
                    await new Promise(res => setTimeout(res, waitTime));
                }
            }
        }
        throw new Error(lastError.name === 'AbortError' ? "서버 응답 시간이 초과되었습니다." : (lastError.message || "보안 연결이 거부되었습니다."));
    }

    // 5. 폼 제출 메인 로직
    async function handleLogin(e) {
        if (e) e.preventDefault();
        if (isAuthenticating) return;

        const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
        const pw = pwInput ? pwInput.value.trim() : "";

        // 🌟 에러 시 네이티브 Shake 호출
        if (!id || !pw) {
            if(errorMsg) errorMsg.innerHTML = `<span class="text-[var(--sinjeon-vibrant)] drop-shadow-md">ID와 Password를 모두 입력해주세요.</span>`;
            triggerShake();
            return;
        }

        isAuthenticating = true;
        const originalBtnText = loginBtn.innerHTML;
        if (loginBtn) {
            loginBtn.disabled = true;
            // 로딩 시에는 화려한 아우라 대신 정적인 피드백
            loginBtn.style.background = "var(--premium-bg)";
            loginBtn.style.color = "var(--sinjeon-pink)";
            loginBtn.style.border = "1px solid var(--sinjeon-pink)";
            loginBtn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-[var(--sinjeon-pink)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING...</span>`;
            loginBtn.classList.add('cursor-not-allowed');
        }
        if (errorMsg) errorMsg.innerText = "";

        try {
            const result = await executeLogin({ id: id, pw: pw });

            if (result.success) {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400 font-bold drop-shadow-md">✅ SECURE SESSION ESTABLISHED</span>`;
                
                localStorage.clear();
                localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, result.token);
                localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, result.role);
                localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, result.clientName);
                localStorage.setItem(CONFIG.STORAGE_KEYS.USER_ID, id);
                localStorage.setItem("y2c_premium_state", result.clientState || "DEFAULT");

                // 로그인 성공 시 우아한 줌 인 & 페이드아웃 효과
                loginForm.style.transition = "all 0.6s cubic-bezier(0.16, 1, 0.3, 1)";
                loginForm.style.transform = "scale(1.05) translateY(-10px)";
                loginForm.style.opacity = "0";
                
                setTimeout(() => {
                    window.location.replace((result.role === "MASTER" || result.role === "VENDOR") ? "admin.html" : "items.html");
                }, 500);

            } else {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-[var(--sinjeon-vibrant)] drop-shadow-md">⚠️ ${result.message || "인증에 실패했습니다."}</span>`;
                triggerShake(); // 네이티브 Shake
            }
        } catch (err) {
            if (errorMsg) errorMsg.innerHTML = `<span class="text-[var(--sinjeon-vibrant)] drop-shadow-md">${err.message}</span>`;
            triggerShake(); // 네이티브 Shake
        } finally {
            if (!loginForm.style.opacity || loginForm.style.opacity !== "0") {
                isAuthenticating = false;
                if (loginBtn) {
                    loginBtn.disabled = false; 
                    loginBtn.innerHTML = originalBtnText; 
                    loginBtn.classList.remove('cursor-not-allowed');
                    loginBtn.style.background = ""; // 리셋
                    loginBtn.style.color = "";
                    loginBtn.style.border = "";
                }
            }
        }
    }

    if (loginForm) {
        loginForm.addEventListener("submit", (e) => { e.preventDefault(); handleLogin(e); });
    }
});
</script>
</body>
</html>
