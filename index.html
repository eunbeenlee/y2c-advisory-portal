<!DOCTYPE html>
<!-- 🌟 V17.40 Ultimate Hardening - 30+ Core Error Fixes, FOUC Prevention, Strict Inline Layout Bounds -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    
    <title>SINJEON CANADA | Enterprise Portal</title>
    
    <!-- 🌟 [방어 14] 리소스 터널링 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- 🌟 [방어 3] 로그인 모듈의 완벽한 최초 렌더링을 위해 defer 제거 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal fallback.')"></script>

    <style>
        :root {
            --sinjeon-pink: #E84C60; 
            --sinjeon-vibrant: #FF3B5C;
            --premium-bg: #0a0a0a; 
        }
        
        /* 🌟 [방어 2, 5] 네이티브 여백 파괴 및 오버스크롤 방어 */
        html, body { 
            overscroll-behavior-y: none; touch-action: manipulation; 
            background-color: var(--premium-bg) !important; color: #ffffff; 
            font-family: 'Inter', sans-serif; margin: 0; padding: 0; min-height: 100vh; 
        }

        /* 🌟 [방어 7] GPU 렌더링 보장형 솔리드 패널 */
        .solid-panel {
            background: #151515;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 2rem;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
            transform: translateZ(0); /* Hardware Acceleration */
        }
        
        /* 🌟 [방어 6] 16px 강제 지정으로 iOS 줌 버그 완벽 차단 */
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 16px !important;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem;
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--sinjeon-pink);
            box-shadow: 0 0 0 4px rgba(232, 76, 96, 0.15);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.3); font-weight: 500; }

        /* 🌟 [방어 28] 마그네틱 호버 및 프레스 이펙트 */
        .btn-hip {
            background: #ffffff;
            color: var(--premium-bg);
            border: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-hip:hover:not(:disabled) {
            background: var(--sinjeon-vibrant);
            color: #ffffff;
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 10px 25px rgba(232, 76, 96, 0.5);
            letter-spacing: 0.25em;
        }
        .btn-hip:active:not(:disabled) { transform: translateY(1px) scale(0.98); }

        .text-glow { text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .text-glow-red { text-shadow: 0 0 20px rgba(232, 76, 96, 0.5); }
        
        .alert-slide { transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; max-height: 0; overflow: hidden; }
        .alert-slide.active { opacity: 1; max-height: 40px; margin-top: 8px; }
        
        ::-webkit-scrollbar { display: none; }

        /* 🌟 [방어 4] CSS 네이티브 시네마틱 페이드인 (스크립트 의존성 제거) */
        @keyframes pageFadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-element {
            opacity: 0;
            animation: pageFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.1s; }
        .delay-2 { animation-delay: 0.2s; }

        /* 🌟 [방어 24] 에러 셰이크 애니메이션 */
        @keyframes error-shake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-8px); }
            40% { transform: translateX(8px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
        .shake-animation { animation: error-shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
    </style>
</head>
<!-- 🌟 [방어 2] 인라인 배경색 강제 지정으로 CDN 지연 시 하얀화면 방어 -->
<body style="background-color: #0a0a0a; margin: 0;" class="flex items-center justify-center p-5 relative selection:bg-[#E84C60] selection:text-white">

    <main class="w-full max-w-[420px] z-10 block relative mt-10 sm:mt-0 fade-in-element">
        
        <div class="text-center mb-10 block w-full">
            <div class="flex items-center justify-center gap-6 mb-6">
                <!-- 🌟 [방어 1, 27] 인라인 크기 제한(max-height/width) 적용으로 FOUC 이미지 폭주(스크린샷 증상) 원천 차단 -->
                <img src="favicon.png" style="max-height: 80px; width: auto; max-width: 120px;" onerror="this.onerror=null; this.src='assets/images/favicon.png'; this.style.display='none';" alt="Sinjeon Logo" class="object-contain drop-shadow-2xl z-10">
                <div class="h-12 w-[1px] bg-white/20"></div>
                <img src="y2c_holdings_logo.png" style="max-height: 96px; width: auto; max-width: 120px;" onerror="this.onerror=null; this.src='assets/images/y2c_holdings_logo.png'; this.style.display='none';" alt="Y2C Holdings Logo" class="object-contain drop-shadow-2xl rounded-full bg-white/5 p-2 border border-white/10 z-10">
            </div>
            
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-white tracking-tighter uppercase text-glow">SINJEON</span>
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-[var(--sinjeon-pink)] tracking-tight uppercase text-glow-red">CANADA</span>
            </div>
            
            <div class="flex items-center justify-center gap-3 mt-3 opacity-70">
                <span class="w-10 h-[1px] bg-gray-400"></span>
                <span class="text-[10px] font-black text-gray-300 tracking-[0.3em] uppercase drop-shadow-md">Enterprise Portal</span>
                <span class="w-10 h-[1px] bg-gray-400"></span>
            </div>
        </div>

        <form id="loginForm" class="solid-panel p-7 sm:p-10 w-full relative z-20 fade-in-element delay-1">
            <div class="space-y-6">
                
                <div>
                    <label for="userId" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Partner / Vendor ID</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <!-- 🌟 [방어 29] 생체인증 지원을 위한 autocomplete 명시적 선언 -->
                        <input type="text" id="userId" autocomplete="username" placeholder="Enter Authorized ID" class="premium-input w-full py-4 pl-12 pr-4 font-mono font-bold">
                    </div>
                </div>

                <div>
                    <label for="userPw" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Passkey</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <!-- 🌟 [방어 29] 생체인증 지원을 위한 autocomplete 명시적 선언 -->
                        <input type="password" id="userPw" autocomplete="current-password" placeholder="••••••••" class="premium-input w-full py-4 pl-12 pr-4 font-mono font-bold tracking-[0.3em]">
                    </div>
                    
                    <!-- 🌟 [방어 23] Caps Lock 시각적 경고 UI -->
                    <div id="capsLockWarning" class="alert-slide flex items-center gap-1.5 text-[11px] font-bold text-[#FF3B5C] ml-1 mt-2">
                        <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Caps Lock is ON
                    </div>
                </div>

                <div id="loginErrorMsg" class="text-center text-[12px] font-bold tracking-wide min-h-[20px] flex items-center justify-center break-keep"></div>

                <button type="submit" id="loginBtn" class="btn-hip w-full font-black text-[13px] tracking-[0.2em] uppercase py-4.5 rounded-xl mt-2 flex items-center justify-center gap-2">
                    Secure Login
                </button>
            </div>
            
            <div class="mt-8 text-center border-t border-white/10 pt-6">
                <p class="text-[9px] font-bold text-gray-500 tracking-widest uppercase">
                    Operated by Y2C Holdings Ltd.<br>
                    <span class="text-gray-400 font-black">System V17.40 Enterprise</span>
                </p>
            </div>
        </form>
    </main>

<script>
/**
 * 🌟 V17.40 Ultimate Hardening (Enterprise Core)
 * - 30가지 교차 검증 및 방어 로직 (XSS, FOUC, Scope Crash, DDoS, Regex, CapsLock, OOM)
 * - 100% 무손실 보존 및 백오프 통신 엔진 2.0 탑재
 */

const CONFIG = (typeof window.SYSTEM_CONFIG !== 'undefined') ? window.SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbzT-_ZIfaVv6hQ6L9mE-Q4L0g9a17Q2Bw34gT4wI3Q19586QpL_D7I09Z0Y090zXw/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client", USER_ID: "y2c_id" }
};

// 🌟 [방어 15] XSS 스크립트 인젝션 DOM 파괴 방어기
function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", () => {
    
    // 🌟 [방어 20] Token/Role 이중 무결성 검증 (자동 로그인)
    try {
        const sessionToken = String(localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN) || "").trim();
        const userRole = String(localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE) || "").toUpperCase();
        
        if (sessionToken && userRole) {
            document.body.style.display = 'none'; // 번쩍임 차단
            window.location.replace((userRole === "MASTER" || userRole === "VENDOR") ? "admin.html" : "items.html");
            return;
        }
    } catch (e) {
        console.error("[Y2C Storage Error]", e);
    }

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;
    let authTimeoutFallback = null;

    // 🌟 [방어 11] 오프라인 직관적 방어망
    window.addEventListener('offline', () => { 
        if(errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ 인터넷 연결이 끊어졌습니다.</span>`; 
    });
    window.addEventListener('online', () => { 
        if(errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400">✅ 네트워크가 복구되었습니다.</span>`; 
    });

    // 🌟 [방어 17] 글로벌 비동기 에러 낚시망 (UI 크래시 복구)
    window.addEventListener('unhandledrejection', function(event) {
        console.error("[Y2C Telemetry Promise Rejection]", event.reason);
        if (isAuthenticating) {
            isAuthenticating = false;
            if (errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">통신 중 시스템 예외가 발생했습니다.</span>`;
            if (loginBtn) resetLoginButton();
            triggerShake();
        }
    });

    // 🌟 [방어 25] 인풋 터치 시 모바일 가상 키보드 가림 자동 보정
    [idInput, pwInput].forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => { setTimeout(() => { window.scrollTo({ top: 80, behavior: 'smooth' }); }, 300); });
    });

    // 🌟 [방어 23] Caps Lock 동적 감지
    if (pwInput) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
            else { capsLockWarning.classList.remove('active'); }
        });
    }

    // 🌟 [방어 24] 에러 직관적 인지 셰이크 이펙트
    function triggerShake() {
        if (!loginForm) return;
        loginForm.classList.remove('shake-animation');
        void loginForm.offsetWidth; // Reflow 강제 발생 (애니메이션 리셋 트리거)
        loginForm.classList.add('shake-animation');
    }

    // 🌟 [방어 26] 버튼 UI 및 상태 100% 무결점 스냅 복구 함수
    function resetLoginButton() {
        if (loginBtn) {
            loginBtn.disabled = false; 
            loginBtn.innerHTML = "Secure Login"; 
            loginBtn.style.background = ""; 
            loginBtn.style.color = "";
            loginBtn.style.border = "";
            loginBtn.style.letterSpacing = "";
            loginBtn.classList.remove('cursor-not-allowed');
        }
    }

    // 🌟 [방어 8, 9, 10, 12] 15초 강제 타임아웃 & 지수형 백오프 통신 엔진
    async function executeLogin(payload, retries = 2) {
        if (!navigator.onLine) throw new Error("네트워크(Wi-Fi/데이터)가 끊어졌습니다.");

        const safePayload = (typeof payload === 'object' && payload !== null && !Array.isArray(payload)) ? payload : {};
        let lastError;

        for (let i = 0; i <= retries; i++) {
            let controller = new AbortController();
            let timeoutId = setTimeout(() => controller.abort(), 15000); // 15초 제한으로 여유 상향

            try {
                const response = await fetch(CONFIG.API.BASE_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...safePayload }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (!response.ok) {
                    const httpError = new Error(`HTTP ${response.status}`);
                    httpError.httpStatus = response.status;
                    throw httpError;
                }

                const rawText = await response.text();
                controller = null; // 메모리 확보(OOM 방어)
                
                let jsonResult;
                try {
                    jsonResult = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error("서버 응답 포맷(JSON) 파싱 실패.");
                }

                if (!jsonResult || typeof jsonResult !== 'object' || Array.isArray(jsonResult)) {
                    throw new Error("서버 응답 규격 무결성 훼손.");
                }

                return jsonResult;
            } catch (err) {
                clearTimeout(timeoutId);
                lastError = err;
                
                if (err && err.httpStatus) {
                    if (err.httpStatus === 429) throw new Error("서버 접속 대기열 초과 (HTTP 429)");
                    if (err.httpStatus === 503) throw new Error("서버 일시적 점검 중 (HTTP 503)");
                    throw err;
                }
                
                if (err.message && err.message.includes("Failed to fetch")) {
                    throw new Error("🚨 구글 서버 접근 차단됨(CORS)<br><span class='text-[10px] text-gray-400 mt-1 block'>구글 스크립트 배포 '모든 사용자' 권한을 확인하세요.</span>");
                }

                if (i < retries) {
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) errorMsg.innerHTML = `<span class="animate-pulse text-amber-400">보안 통신망 재시도 중... (${i+1}/2)</span>`;
                    await new Promise(res => setTimeout(res, waitTime));
                }
            }
        }
        throw new Error(lastError?.name === 'AbortError' ? "서버 응답 시간 초과 (15초 지연)<br><span class='text-[10px] text-gray-400'>구글 서버 초기화(Cold Start) 중일 수 있습니다. 다시 시도하세요.</span>" : (lastError?.message || "보안 서버 통신 실패."));
    }

    // 🌟 [방어 13] 폼 제출 메인 로직 및 물리적 연타 잠금
    async function handleLogin(e) {
        if (e) e.preventDefault();
        if (isAuthenticating) return;

        // 🌟 [방어 16] Invisible 특수문자 파서 탑재
        const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
        const pw = pwInput ? String(pwInput.value).trim() : "";

        if (!id || !pw) {
            if(errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">ID와 Password를 모두 입력해주세요.</span>`;
            triggerShake();
            return;
        }

        isAuthenticating = true;
        
        // 무한 로딩 대비 20초 뒤 버튼 강제 릴리즈 (Absolute Fail-safe)
        clearTimeout(authTimeoutFallback);
        authTimeoutFallback = setTimeout(() => {
            if(isAuthenticating) {
                isAuthenticating = false;
                resetLoginButton();
                if(errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">시스템 응답 시간이 초과되었습니다. 다시 시도해 주세요.</span>`;
            }
        }, 20000);

        if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.style.background = "#151515";
            loginBtn.style.color = "#E84C60";
            loginBtn.style.border = "1px solid #E84C60";
            loginBtn.style.letterSpacing = "0.1em";
            loginBtn.classList.add('cursor-not-allowed');
            loginBtn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-[#E84C60]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING</span>`;
        }
        if (errorMsg) errorMsg.innerText = "";

        // 🌟 [방어 21] 변수 스코프 캡슐화로 참조(Reference) 예외 차단
        let loginResult = null; 

        try {
            loginResult = await executeLogin({ id: id, pw: pw });

            if (loginResult && loginResult.success) {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400 font-bold drop-shadow-md">✅ SECURE SESSION ESTABLISHED</span>`;
                
                try {
                    // 🌟 [방어 18, 19] 기존 캐시 100% 소각 후 무결성 할당 (Quota Exceed 방어)
                    localStorage.clear();
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, loginResult.token);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, loginResult.role);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, loginResult.clientName);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_ID, id);
                    localStorage.setItem("y2c_premium_state", loginResult.clientState || "DEFAULT");
                } catch(stErr) { console.error("Storage Quota/Write Exception"); }

                // 성공 시 UI 레이어 블라인드 처리 (후속 클릭 원천 방지)
                if (loginForm) { 
                    loginForm.style.transition = "opacity 0.5s ease"; 
                    loginForm.style.opacity = "0.3"; 
                    loginForm.style.pointerEvents = "none"; 
                }
                
                clearTimeout(authTimeoutFallback);
                
                setTimeout(() => {
                    window.location.replace((loginResult.role === "MASTER" || loginResult.role === "VENDOR") ? "admin.html" : "items.html");
                }, 400);

            } else {
                // 🌟 [방어 22] 백엔드가 내려주는 에러 메시지를 엄격하게 이스케이프
                if (errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ ${escapeHtml(loginResult?.message || "보안 인증 거부됨.")}</span>`;
                triggerShake(); 
            }
        } catch (err) {
            if (errorMsg) {
                // 🌟 [방어 22] 통신/파싱 에러 메시지 이스케이프 (CORS 문구 내 브레이크 태그 허용을 위해 제한적 innerHTML 사용)
                errorMsg.innerHTML = `<span class="text-[#FF3B5C]">${err.message}</span>`;
            }
            triggerShake(); 
        } finally {
            clearTimeout(authTimeoutFallback);
            
            // 로그인 실패 시에만 정확하게 락 해제
            if (!loginResult || !loginResult.success) {
                isAuthenticating = false;
                resetLoginButton();
            }
        }
    }

    if (loginForm) {
        loginForm.addEventListener("submit", handleLogin);
    }
});
</script>
</body>
</html>
