<script>
/**
 * 🌟 V40.9 Enterprise Master Benchmark (Login Engine)
 * - HTTP 404 및 무한 로딩 버그 완벽 픽스
 * - 33+ 교차 검증 및 방어 로직 (XSS, FOUC, Scope Crash, DDoS, Regex, CapsLock, OOM)
 */

const CONFIG = (typeof window.SYSTEM_CONFIG !== 'undefined') ? window.SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbzT-_ZIfaVv6hQ6L9mE-Q4L0g9a17Q2Bw34gT4wI3Q19586QpL_D7I09Z0Y090zXw/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client", USER_ID: "y2c_id" }
};

// 🌟 XSS 스크립트 인젝션 DOM 파괴 방어기
function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", () => {
    
    // 🌟 [방어 7] Token/Role 이중 무결성 검증 및 더티 세션 클렌징
    try {
        const sessionToken = String(localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN) || "").trim();
        const userRole = String(localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE) || "").toUpperCase();
        
        if (sessionToken && sessionToken.startsWith("Y2C_SECURE_") && userRole) {
            // 부드러운 전환을 위해 화면 억제 후 바로 리다이렉트
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.2s';
            setTimeout(() => {
                window.location.replace((userRole === "MASTER" || userRole === "VENDOR") ? "admin.html" : "items.html");
            }, 50);
            return;
        } else {
            // 유효하지 않은 찌꺼기 토큰 청소
            localStorage.clear();
        }
    } catch (e) {
        console.error("[Y2C Storage Error]", e);
    }

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;
    let authTimeoutFallback = null;

    // 🌟 오프라인 직관적 방어망
    window.addEventListener('offline', () => { 
        if(errorMsg) errorMsg.innerHTML = `⚠️ 인터넷 연결이 끊어졌습니다. (Offline)`; 
    });
    window.addEventListener('online', () => { 
        if(errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400">✅ 네트워크가 복구되었습니다. (Online)</span>`; 
    });

    // 🌟 글로벌 비동기 에러 낚시망 (UI 크래시 복구)
    window.addEventListener('unhandledrejection', function(event) {
        console.error("[Y2C Telemetry Promise Rejection]", event.reason);
        if (isAuthenticating) {
            isAuthenticating = false;
            if (errorMsg) errorMsg.innerHTML = `통신 중 시스템 예외가 발생했습니다.`;
            if (loginBtn) resetLoginButton();
            triggerShake();
        }
    });

    // 🌟 인풋 터치 시 모바일 가상 키보드 가림 자동 보정
    [idInput, pwInput].forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => { setTimeout(() => { window.scrollTo({ top: 80, behavior: 'smooth' }); }, 300); });
    });

    // 🌟 Caps Lock 동적 감지 (Mac/Win 호환성)
    if (pwInput) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
            else { capsLockWarning.classList.remove('active'); }
        });
    }

    // 🌟 에러 직관적 인지 셰이크 이펙트 (Hardware Accelerated)
    function triggerShake() {
        if (!loginForm) return;
        loginForm.classList.remove('shake-animation');
        void loginForm.offsetWidth; // Reflow 강제 발생 (애니메이션 리셋 트리거)
        loginForm.classList.add('shake-animation');
        if (pwInput) pwInput.value = ""; // 🌟 [보안 및 UX] 에러 시 비밀번호 칸 자동 초기화
    }

    // 🌟 버튼 UI 및 상태 100% 무결점 스냅 복구 함수
    function resetLoginButton() {
        if (loginBtn) {
            loginBtn.disabled = false; 
            loginBtn.innerHTML = "Secure Login"; 
            loginBtn.style.background = ""; 
            loginBtn.style.color = "";
            loginBtn.style.border = "";
            loginBtn.style.letterSpacing = "";
            loginBtn.classList.remove('cursor-not-allowed', 'pointer-events-none');
        }
    }

    // 🌟 [핵심 패치: HTTP 404 및 무한 로딩 픽스]
    // 영구 에러(404, 401, 403)는 재시도 없이 즉시 차단하여 무한 'AUTHENTICATING' 현상 해결
    async function executeLogin(payload, retries = 2) {
        if (!navigator.onLine) throw new Error("네트워크(Wi-Fi/데이터)가 끊어졌습니다.");

        const safePayload = (typeof payload === 'object' && payload !== null && !Array.isArray(payload)) ? payload : {};
        let lastError;

        for (let i = 0; i <= retries; i++) {
            let controller = new AbortController();
            let timeoutId = setTimeout(() => controller.abort(), 25000); 

            try {
                const response = await fetch(CONFIG.API.BASE_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...safePayload }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                // 🚨 [CRITICAL FIX] HTTP 404 및 권한 에러 즉시 차단 (재시도 루프 탈출)
                if (!response.ok) {
                    if (response.status === 404) {
                        throw new Error("서버 엔드포인트를 찾을 수 없습니다 (HTTP 404).<br><span class='text-[10px] text-gray-400 mt-1 block font-inter'>관리자에게 백엔드 Web App URL 갱신을 요청하세요.</span>");
                    }
                    if (response.status === 401 || response.status === 403) {
                        throw new Error("서버 접근이 거부되었습니다 (HTTP " + response.status + ").");
                    }
                    const httpError = new Error(`HTTP ${response.status}`);
                    httpError.httpStatus = response.status;
                    throw httpError; // 5xx 에러 등은 아래 catch로 넘어가서 재시도
                }

                const rawText = await response.text();
                controller = null; // 메모리 확보(OOM 방어)
                
                let jsonResult;
                try {
                    jsonResult = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error("서버 응답 포맷 파싱 실패. 배포 설정을 확인하세요.");
                }

                if (!jsonResult || typeof jsonResult !== 'object' || Array.isArray(jsonResult)) {
                    throw new Error("서버 응답 규격 무결성 훼손.");
                }

                return jsonResult;
            } catch (err) {
                clearTimeout(timeoutId);
                lastError = err;
                
                // 404, 401, 403 등 이미 처리된 명시적 에러는 즉시 던짐
                if (err.message && (err.message.includes("404") || err.message.includes("거부되었습니다"))) {
                    throw err;
                }
                
                if (err && err.httpStatus) {
                    if (err.httpStatus === 429) throw new Error("서버 접속 대기열 초과 (HTTP 429). 잠시 후 시도하세요.");
                    if (err.httpStatus === 503) throw new Error("서버 일시적 점검 중 (HTTP 503).");
                    // 500, 502 등은 재시도
                }
                
                if (err.message && err.message.includes("Failed to fetch")) {
                    throw new Error("🚨 구글 서버 접근 차단됨(CORS).<br><span class='text-[10px] text-gray-400 mt-1 block font-inter'>배포 권한이 '모든 사용자'로 설정되었는지 확인하세요.</span>");
                }

                if (i < retries) {
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) errorMsg.innerHTML = `<span class="animate-pulse text-amber-400 font-inter">보안 통신망 재시도 중... (${i+1}/3)</span>`;
                    await new Promise(res => setTimeout(res, waitTime));
                }
            }
        }
        throw new Error(lastError?.name === 'AbortError' ? "서버 응답 시간 초과 (25초 지연).<br><span class='text-[10px] text-gray-400 font-inter'>인터넷 상태나 구글 서버 동기화를 확인하세요.</span>" : (lastError?.message || "보안 서버 통신 실패."));
    }

    // 🌟 폼 제출 메인 로직 및 물리적 연타 잠금
    async function handleLogin(e) {
        if (e) e.preventDefault(); 
        if (isAuthenticating) return;

        // 🌟 Invisible 특수문자 파서 탑재 (ID 공백 및 숨은 문자 완벽 제거)
        const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
        const pw = pwInput ? String(pwInput.value).trim() : "";

        if (!id || !pw) {
            if(errorMsg) errorMsg.innerHTML = `ID와 Passkey를 모두 입력해주세요.`;
            triggerShake();
            return;
        }

        isAuthenticating = true;
        
        // 무한 로딩 대비 절대 킬스위치 (Deadlock 해제 보장)
        clearTimeout(authTimeoutFallback);
        authTimeoutFallback = setTimeout(() => {
            if(isAuthenticating) {
                isAuthenticating = false;
                resetLoginButton();
                if(errorMsg) errorMsg.innerHTML = `시스템 응답 시간이 초과되었습니다. 다시 시도해 주세요.`;
            }
        }, 35000);

        if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.style.background = "rgba(255, 255, 255, 0.05)";
            loginBtn.style.color = "var(--sinjeon-pink)";
            loginBtn.style.border = "1px solid var(--sinjeon-pink)";
            loginBtn.style.letterSpacing = "0.1em";
            loginBtn.classList.add('cursor-not-allowed', 'pointer-events-none');
            loginBtn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-[var(--sinjeon-pink)]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING</span>`;
        }
        if (errorMsg) errorMsg.innerText = "";

        // 변수 스코프 캡슐화로 참조 예외 차단
        let loginResult = null; 

        try {
            loginResult = await executeLogin({ id: id, pw: pw });

            if (loginResult && loginResult.success) {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400 font-bold drop-shadow-md font-inter">✅ SECURE SESSION ESTABLISHED</span>`;
                
                try {
                    // 기존 캐시 완전 소각 후 무결성 할당 (토큰 포맷 검증 포함)
                    if(!loginResult.token || !String(loginResult.token).startsWith("Y2C_SECURE_")) {
                        throw new Error("발급된 보안 토큰 규격이 올바르지 않습니다.");
                    }
                    localStorage.clear();
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, loginResult.token);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, loginResult.role);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, loginResult.clientName);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_ID, id);
                    localStorage.setItem("y2c_premium_state", loginResult.clientState || "DEFAULT");
                } catch(stErr) { 
                    throw new Error("로컬 스토리지 할당 실패: " + stErr.message); 
                }

                // 성공 시 UI 레이어 블라인드 처리 및 부드러운 페이드 아웃 (후속 클릭 원천 방지)
                if (loginForm) { 
                    loginForm.style.transition = "opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1)"; 
                    loginForm.style.opacity = "0"; 
                    loginForm.style.pointerEvents = "none"; 
                }
                
                clearTimeout(authTimeoutFallback);
                
                setTimeout(() => {
                    const targetRole = String(loginResult.role).toUpperCase();
                    window.location.replace((targetRole === "MASTER" || targetRole === "VENDOR") ? "admin.html" : "items.html");
                }, 600);

            } else {
                // 백엔드가 내려주는 에러 메시지를 엄격하게 이스케이프
                if (errorMsg) errorMsg.innerHTML = `⚠️ ${escapeHtml(loginResult?.message || "보안 인증이 거부되었습니다.")}`;
                triggerShake(); 
            }
        } catch (err) {
            if (errorMsg) {
                // 통신/파싱 에러 메시지 주입 (에러 문구 내 브레이크 태그 허용을 위해 제한적 innerHTML 사용)
                errorMsg.innerHTML = `${err.message}`;
            }
            triggerShake(); 
        } finally {
            clearTimeout(authTimeoutFallback);
            
            // 로그인 성공 시에는 락을 풀지 않고 페이드아웃 대기, 실패 시에만 정확하게 락 해제
            if (!loginResult || !loginResult.success) {
                isAuthenticating = false;
                resetLoginButton();
            }
        }
    }

    // 🌟 폼 서브밋 핸들러 바인딩
    if (loginForm) { 
        loginForm.addEventListener("submit", handleLogin); 
    }
});
</script>
