<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- 🌟 모바일 고급화 전략: iOS 자동 확대(Zoom) 완벽 차단 및 화면 고정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SINJEON CANADA | Enterprise Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 🌟 로고 플레이 및 타이포그래피 고급화를 위한 웹 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- SYSTEM CONFIG (안전망 연동) -->
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal fallback.')"></script>

    <style>
        :root {
            --sj-red: #E3000F; /* 글로벌 브랜드 기준 선명하고 압도적인 신전 레드 */
            --sj-red-dark: #9A0007;
            --sj-red-glow: rgba(227, 0, 15, 0.45);
            --bg-obsidian: #050505;
            --glass-bg: rgba(10, 10, 10, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-obsidian);
            color: #ffffff;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* 🌟 앰비언트 오로라 애니메이션 (하이엔드 배경) */
        .ambient-bg {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            overflow: hidden; z-index: 0;
            background-image: radial-gradient(circle at 50% 50%, rgba(20,20,20,1) 0%, var(--bg-obsidian) 100%);
        }
        .aurora-1 {
            position: absolute; top: -20%; left: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(227,0,15,0.12) 0%, rgba(0,0,0,0) 70%);
            animation: float-aurora 20s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }
        .aurora-2 {
            position: absolute; bottom: -20%; right: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0) 70%);
            animation: float-aurora 15s infinite alternate-reverse cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes float-aurora {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(5%, 10%) scale(1.1); }
        }

        /* 🌟 시네마틱 등장 애니메이션 */
        .cinematic-enter { opacity: 0; transform: translateY(20px); animation: fadeUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .delay-100 { animation-delay: 0.15s; }
        .delay-200 { animation-delay: 0.3s; }
        .delay-300 { animation-delay: 0.45s; }
        .delay-400 { animation-delay: 0.6s; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* 🌟 럭셔리 글래스 패널 */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 1), inset 0 1px 0 rgba(255,255,255,0.05);
            position: relative;
        }
        
        /* 🌟 모바일 최적화: 16px(text-base) 폰트로 iOS 줌 방지, 넓은 터치 영역 */
        .premium-input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            transition: all 0.3s ease;
            font-size: 16px !important; 
        }
        .premium-input:focus {
            background: rgba(0, 0, 0, 0.7);
            border-color: var(--sj-red);
            box-shadow: 0 0 0 3px rgba(227, 0, 15, 0.15);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.25); font-weight: 400; letter-spacing: 0.05em; }

        /* 하이엔드 마그네틱 버튼 효과 */
        .btn-premium {
            background: linear-gradient(135deg, var(--sj-red) 0%, var(--sj-red-dark) 100%);
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
        }
        .btn-premium::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: all 0.6s ease;
        }
        .btn-premium:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(227, 0, 15, 0.4);
        }
        .btn-premium:hover:not(:disabled)::before { left: 100%; }
        .btn-premium:active:not(:disabled) { transform: translateY(1px); box-shadow: 0 5px 15px rgba(227, 0, 15, 0.4); }

        /* 노이즈 텍스처 오버레이 (고급스러운 매트 질감) */
        .noise-overlay {
            position: fixed; inset: 0; z-index: 9999; pointer-events: none; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        #capsLockWarning { transition: all 0.3s ease; opacity: 0; height: 0; overflow: hidden; transform: translateY(-5px); }
        #capsLockWarning.active { opacity: 1; height: 24px; margin-top: 8px; transform: translateY(0); }
        ::-webkit-scrollbar { display: none; }
        
        /* 🌟 로고 플레이 전용 필터 (다크모드 최적화) */
        .logo-filter { filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5 relative">

    <div class="noise-overlay"></div>
    
    <!-- 하이엔드 앰비언트 배경 -->
    <div class="ambient-bg">
        <div class="aurora-1"></div>
        <div class="aurora-2"></div>
    </div>

    <main class="w-full max-w-[420px] z-10">
        
        <!-- 🌟 듀얼 로고 플레이 영역 -->
        <div class="text-center mb-10 cinematic-enter">
            <div class="flex items-center justify-center gap-6 mb-6">
                <!-- Sinjeon Favicon -->
                <img src="favicon.png" alt="Sinjeon Logo" class="h-16 sm:h-20 object-contain logo-filter hover:scale-105 transition-transform duration-500">
                <!-- 구분선 -->
                <div class="h-12 w-px bg-gradient-to-b from-transparent via-white/30 to-transparent"></div>
                <!-- Y2C Holdings Logo -->
                <img src="y2c_holdings_logo.png" alt="Y2C Holdings Logo" class="h-20 sm:h-24 object-contain logo-filter hover:scale-105 transition-transform duration-500 rounded-full bg-white/5 p-1 backdrop-blur-sm">
            </div>
            
            <div class="flex items-center justify-center gap-2 mb-1.5">
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-white tracking-tighter uppercase drop-shadow-lg">SINJEON</span>
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-[#E3000F] tracking-tight uppercase drop-shadow-lg">CANADA</span>
            </div>
            
            <p class="text-[10px] font-bold text-gray-400 tracking-[0.3em] uppercase flex items-center justify-center gap-3 mt-3">
                <span class="w-8 h-[1px] bg-gradient-to-r from-transparent to-gray-500"></span>
                <span>Enterprise Portal</span>
                <span class="w-8 h-[1px] bg-gradient-to-l from-transparent to-gray-500"></span>
            </p>
        </div>

        <!-- 로그인 폼 -->
        <form id="loginForm" class="glass-panel rounded-[2rem] p-7 sm:p-10 cinematic-enter delay-100 relative">
            <div class="space-y-6">
                
                <!-- ID Input -->
                <div class="relative cinematic-enter delay-200">
                    <label for="userId" class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-2 ml-1">Partner / Vendor ID</label>
                    <div class="relative flex items-center group">
                        <span class="absolute left-4 text-gray-400 group-focus-within:text-[#E3000F] transition-colors duration-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" autocomplete="username" placeholder="Enter Authorized ID" 
                            class="premium-input w-full rounded-xl py-4 pl-12 pr-4 font-mono font-bold">
                    </div>
                </div>

                <!-- PW Input -->
                <div class="relative cinematic-enter delay-300">
                    <label for="userPw" class="block text-[10px] font-bold text-gray-400 uppercase tracking-[0.15em] mb-2 ml-1">Passkey</label>
                    <div class="relative flex items-center group">
                        <span class="absolute left-4 text-gray-400 group-focus-within:text-[#E3000F] transition-colors duration-300">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="userPw" autocomplete="current-password" placeholder="••••••••" 
                            class="premium-input w-full rounded-xl py-4 pl-12 pr-4 font-mono font-bold tracking-[0.25em]">
                    </div>
                    <!-- CapsLock Warning -->
                    <div id="capsLockWarning" class="flex items-center gap-1.5 text-[11px] font-bold text-amber-500 ml-1">
                        <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Caps Lock is ON
                    </div>
                </div>

                <!-- Error Message Area -->
                <div id="loginErrorMsg" class="text-center text-[12px] font-bold tracking-wide transition-all min-h-[20px] flex items-center justify-center break-keep"></div>

                <!-- Submit Button -->
                <button type="submit" id="loginBtn" class="btn-premium w-full text-white font-black text-[13px] tracking-[0.2em] uppercase py-4.5 rounded-xl mt-2 cinematic-enter delay-400 shadow-2xl flex items-center justify-center gap-2">
                    Secure Login
                </button>
            </div>
            
            <div class="mt-8 text-center cinematic-enter delay-400 border-t border-white/10 pt-5">
                <p class="text-[9px] font-medium text-gray-500 tracking-widest leading-relaxed uppercase">
                    Operated by Y2C Holdings Ltd.<br>
                    System V14.1 Ultimate
                </p>
            </div>
        </form>
    </main>

<script>
/**
 * 🌟 V14.1 Enterprise Login Core Logic (12-Layer Shield)
 * 다중 접속 방어, 세션 만료 차단, Jitter Backoff 무결성 검증 완료
 */

const CONFIG = (typeof SYSTEM_CONFIG !== 'undefined') ? SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbzT-_ZIfaVv6hQ6L9mE-Q4L0g9a17Q2Bw34gT4wI3Q19586QpL_D7I09Z0Y090zXw/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client", USER_ID: "y2c_id" }
};

document.addEventListener("DOMContentLoaded", () => {
    // 🌟 [방어 1] 기 로그인 상태의 사용자는 인증 스킵 후 쾌속 이송 (세션 스니핑 방어)
    const sessionToken = localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN);
    const userRole = localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE);
    if (sessionToken && userRole) {
        document.body.style.opacity = '0';
        window.location.replace(userRole === "MASTER" ? "admin.html" : "items.html");
        return;
    }

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;

    // 🌟 [방어 2] 모바일 가상 키보드 UI 가림 방어 (부드러운 포커스 이동)
    const inputs = [idInput, pwInput];
    inputs.forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => {
            setTimeout(() => { input.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 300);
        });
    });

    // 🌟 [방어 3] Caps Lock 작동 감지 (패스워드 입력 오류 예방)
    if (pwInput) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) {
                capsLockWarning.classList.add('active');
            } else {
                capsLockWarning.classList.remove('active');
            }
        });
    }

    // 🌟 [방어 4] 최강 통신 방어막 (지능형 Jitter Backoff + 20초 AbortController)
    async function executeLogin(payload, retries = 3) {
        if (!navigator.onLine) throw new Error("네트워크 연결이 오프라인 상태입니다.");

        let lastError;
        for (let i = 0; i <= retries; i++) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 20000); 

            try {
                const response = await fetch(CONFIG.API.BASE_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...payload }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);
                const rawText = await response.text();
                
                try {
                    const jsonResult = JSON.parse(rawText);
                    // 서버 병목 현상 감지 시 즉각 에러 던져서 우회 접속(재시도) 유도
                    if (!jsonResult.success && jsonResult.message && (jsonResult.message.includes("트래픽") || jsonResult.message.includes("병목") || jsonResult.message.includes("지연"))) {
                        throw new Error(jsonResult.message);
                    }
                    return jsonResult;
                } catch (parseErr) {
                    throw new Error("서버 응답 지연. 안전망을 통해 우회 접속합니다.");
                }
            } catch (err) {
                clearTimeout(timeoutId);
                lastError = err;
                if (i < retries) {
                    // 동시 다발적 접속 시 서버 부하를 막는 랜더마이즈 딜레이(Jitter)
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) errorMsg.innerHTML = `<span class="animate-pulse text-amber-400 font-bold">보안 트래픽 우회 중... (${i+1}/3)</span>`;
                    await new Promise(res => setTimeout(res, waitTime));
                }
            }
        }
        throw new Error(lastError.message || "보안 연결이 거부되었습니다. 네트워크를 확인하세요.");
    }

    // 🌟 메인 로그인 컨트롤러
    async function handleLogin(e) {
        if (e) e.preventDefault();
        
        // 🌟 [방어 5] 이중 클릭 및 폼 중복 제출 뻥튀기 방어
        if (isAuthenticating) return;

        // 🌟 [방어 6] 모바일 자동완성 유니코드 공백 완전 분쇄 (ID/PW 오타 방지)
        const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
        const pw = pwInput ? pwInput.value.trim() : "";

        if (!id || !pw) {
            if(errorMsg) errorMsg.innerHTML = `<span class="text-[#E3000F]">ID와 Password를 모두 입력해주세요.</span>`;
            // UI 시각적 피드백 (흔들림 효과)
            loginForm.style.transform = "translateX(5px)";
            setTimeout(() => loginForm.style.transform = "translateX(-5px)", 50);
            setTimeout(() => loginForm.style.transform = "translateX(0)", 100);
            return;
        }

        isAuthenticating = true;
        const originalBtnText = loginBtn.innerHTML;
        if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.innerHTML = `<span class="animate-pulse flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING...</span>`;
            loginBtn.classList.add('opacity-80', 'cursor-not-allowed');
        }
        if (errorMsg) errorMsg.innerText = "";

        try {
            const result = await executeLogin({ id: id, pw: pw });

            if (result.success) {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400 font-bold">✅ SECURE SESSION ESTABLISHED</span>`;
                
                // 🌟 [방어 7] 완전 무결성 보장을 위해 기존 찌꺼기 세션 폭파 후 재할당
                localStorage.clear();
                localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, result.token);
                localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, result.role);
                localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, result.clientName);
                localStorage.setItem(CONFIG.STORAGE_KEYS.USER_ID, id);
                localStorage.setItem("y2c_premium_state", result.clientState || "DEFAULT");

                // 시네마틱 퇴장 애니메이션 처리
                loginForm.style.transition = "all 0.5s cubic-bezier(0.16, 1, 0.3, 1)";
                loginForm.style.transform = "scale(0.95) translateY(20px)";
                loginForm.style.opacity = "0";
                
                setTimeout(() => {
                    window.location.replace(result.role === "MASTER" ? "admin.html" : "items.html");
                }, 450);

            } else {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-[#E3000F]">⚠️ ${result.message || "인증에 실패했습니다."}</span>`;
            }
        } catch (err) {
            if (errorMsg) errorMsg.innerHTML = `<span class="text-[#E3000F]">${err.message}</span>`;
        } finally {
            if (!loginForm.style.opacity || loginForm.style.opacity !== "0") {
                isAuthenticating = false;
                if (loginBtn) {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.classList.remove('opacity-80', 'cursor-not-allowed');
                }
            }
        }
    }

    if (loginForm) {
        loginForm.addEventListener("submit", (e) => { e.preventDefault(); handleLogin(e); });
    }
});
</script>
</body>
</html>
