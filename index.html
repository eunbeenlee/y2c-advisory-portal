<!DOCTYPE html>
<!-- 🌟 V17.34 Production Hardening (Solid State) - GPU 크래시 원천 차단 및 무조건 렌더링 보장 규격 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <title>SINJEON CANADA | Enterprise Portal</title>
    <link rel="icon" type="image/png" href="favicon.png">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Montserrat:ital,wght@0,700;0,800;0,900;1,800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js" onerror="console.warn('config.js load failed, using internal fallback.')"></script>

    <style>
        :root {
            --sinjeon-pink: #E84C60; 
            --sinjeon-vibrant: #FF3B5C;
            --premium-bg: #0a0a0a; 
        }
        
        html, body { overscroll-behavior-y: none; touch-action: manipulation; background-color: var(--premium-bg); color: #ffffff; font-family: 'Inter', sans-serif; margin: 0; padding: 0; height: 100%; }

        /* 🌟 [렌더링 보장] GPU 부하를 일으키는 backdrop-filter 제거 및 단색(Solid) 배경 적용 */
        .solid-panel {
            background: #151515;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            border-radius: 2rem;
            display: block !important;
            visibility: visible !important;
            opacity: 1 !important;
        }
        
        .premium-input {
            appearance: none; -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 16px !important;
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .premium-input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--sinjeon-pink);
            box-shadow: 0 0 0 3px rgba(232, 76, 96, 0.2);
            outline: none;
        }
        .premium-input::placeholder { color: rgba(255, 255, 255, 0.4); font-weight: 500; }

        .btn-hip {
            background: #ffffff;
            color: var(--premium-bg);
            border: none;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255,255,255,0.1);
        }
        .btn-hip:hover:not(:disabled) {
            background: var(--sinjeon-vibrant);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(232, 76, 96, 0.5);
        }
        .btn-hip:active:not(:disabled) { transform: translateY(1px); }

        .text-glow { text-shadow: 0 0 15px rgba(255, 255, 255, 0.2); }
        .text-glow-red { text-shadow: 0 0 20px rgba(232, 76, 96, 0.5); }
        
        .alert-slide { transition: all 0.3s ease; opacity: 0; max-height: 0; overflow: hidden; }
        .alert-slide.active { opacity: 1; max-height: 40px; margin-top: 8px; }
        
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="flex items-center justify-center p-5 relative selection:bg-[#E84C60] selection:text-white">

    <main class="w-full max-w-[420px] z-10 block relative mt-10 sm:mt-0">
        
        <!-- 🌟 듀얼 로고 & 브랜드 타이포그래피 -->
        <div class="text-center mb-10 block">
            <div class="flex items-center justify-center gap-6 mb-6">
                <img src="favicon.png" onerror="this.onerror=null; this.src='assets/images/favicon.png'; this.style.display='none';" alt="Sinjeon Logo" class="h-16 sm:h-20 object-contain drop-shadow-2xl z-10">
                <div class="h-12 w-[1px] bg-white/20"></div>
                <img src="y2c_holdings_logo.png" onerror="this.onerror=null; this.src='assets/images/y2c_holdings_logo.png'; this.style.display='none';" alt="Y2C Holdings Logo" class="h-20 sm:h-24 object-contain drop-shadow-2xl rounded-full bg-white/5 p-2 border border-white/10 z-10">
            </div>
            
            <div class="flex items-center justify-center gap-2 mb-1">
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-white tracking-tighter uppercase text-glow">SINJEON</span>
                <span class="font-montserrat text-3xl sm:text-4xl font-black text-[var(--sinjeon-pink)] tracking-tight uppercase text-glow-red">CANADA</span>
            </div>
            
            <div class="flex items-center justify-center gap-3 mt-3 opacity-70">
                <span class="w-10 h-[1px] bg-gray-400"></span>
                <span class="text-[10px] font-black text-gray-300 tracking-[0.3em] uppercase drop-shadow-md">Enterprise Portal</span>
                <span class="w-10 h-[1px] bg-gray-400"></span>
            </div>
        </div>

        <!-- 🌟 로그인 폼 (무조건 렌더링 보장형 솔리드 패널) -->
        <form id="loginForm" class="solid-panel p-7 sm:p-10 w-full relative z-20">
            <div class="space-y-6">
                
                <div>
                    <label for="userId" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Partner / Vendor ID</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" id="userId" autocomplete="username" placeholder="Enter Authorized ID" class="premium-input w-full py-4.5 pl-12 pr-4 font-mono font-bold">
                    </div>
                </div>

                <div>
                    <label for="userPw" class="block text-[10px] font-black text-gray-400 uppercase tracking-[0.2em] mb-2 ml-1">Passkey</label>
                    <div class="relative flex items-center">
                        <span class="absolute left-4 text-gray-500 pointer-events-none">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" id="userPw" autocomplete="current-password" placeholder="••••••••" class="premium-input w-full py-4.5 pl-12 pr-4 font-mono font-bold tracking-[0.3em]">
                    </div>
                    
                    <div id="capsLockWarning" class="alert-slide flex items-center gap-1.5 text-[11px] font-bold text-[#FF3B5C] ml-1 mt-2">
                        <svg class="w-3 h-3 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                        Caps Lock is ON
                    </div>
                </div>

                <div id="loginErrorMsg" class="text-center text-[12px] font-bold tracking-wide min-h-[20px] flex items-center justify-center break-keep"></div>

                <button type="submit" id="loginBtn" class="btn-hip w-full font-black text-[13px] tracking-[0.2em] uppercase py-4.5 rounded-xl mt-2 flex items-center justify-center gap-2">
                    Secure Login
                </button>
            </div>
            
            <div class="mt-8 text-center border-t border-white/10 pt-6">
                <p class="text-[9px] font-bold text-gray-500 tracking-widest uppercase">
                    Operated by Y2C Holdings Ltd.<br>
                    <span class="text-gray-400 font-black">System V17.34 Enterprise</span>
                </p>
            </div>
        </form>
    </main>

<script>
/**
 * 🌟 V17.34 Production Hardening - Login Module (Solid State)
 * - 100% 무손실 보존 + 10초 강제 타임아웃(AbortController) 및 Brute-Force 방어 연동
 */

const CONFIG = (typeof window.SYSTEM_CONFIG !== 'undefined') ? window.SYSTEM_CONFIG : {
    API: { BASE_URL: "https://script.google.com/macros/s/AKfycbzT-_ZIfaVv6hQ6L9mE-Q4L0g9a17Q2Bw34gT4wI3Q19586QpL_D7I09Z0Y090zXw/exec" }, 
    STORAGE_KEYS: { USER_TOKEN: "y2c_token", ROLE: "y2c_role", CLIENT_NAME: "y2c_client", USER_ID: "y2c_id" }
};

function escapeHtml(value) {
    return String(value == null ? "" : value).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}

document.addEventListener("DOMContentLoaded", () => {
    // 1. 보안 라우팅 (자동 로그인 확인)
    try {
        const sessionToken = String(localStorage.getItem(CONFIG.STORAGE_KEYS.USER_TOKEN) || "").trim();
        const userRole = String(localStorage.getItem(CONFIG.STORAGE_KEYS.ROLE) || "").toUpperCase();
        
        if (sessionToken && userRole) {
            document.body.style.display = 'none';
            window.location.replace((userRole === "MASTER" || userRole === "VENDOR") ? "admin.html" : "items.html");
            return;
        }
    } catch (e) {
        console.error("[Y2C Storage Error]", e);
    }

    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const idInput = document.getElementById("userId");
    const pwInput = document.getElementById("userPw");
    const errorMsg = document.getElementById("loginErrorMsg");
    const capsLockWarning = document.getElementById("capsLockWarning");

    let isAuthenticating = false;

    window.addEventListener('offline', () => { 
        if(errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ 인터넷 연결이 끊어졌습니다.</span>`; 
    });
    window.addEventListener('online', () => { 
        if(errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400">✅ 네트워크가 복구되었습니다.</span>`; 
    });

    // 모바일 가상 키보드 가림 방어
    [idInput, pwInput].forEach(input => {
        if(!input) return;
        input.addEventListener('focus', () => { setTimeout(() => { window.scrollTo({ top: 100, behavior: 'smooth' }); }, 300); });
    });

    if (pwInput) {
        pwInput.addEventListener('keyup', (e) => {
            if (e.getModifierState && e.getModifierState('CapsLock')) { capsLockWarning.classList.add('active'); } 
            else { capsLockWarning.classList.remove('active'); }
        });
    }

    // 🌟 10초 강제 타임아웃 적용 및 브라우저 프리징 방어 백오프 엔진
    async function executeLogin(payload, retries = 2) {
        if (!navigator.onLine) throw new Error("네트워크(Wi-Fi/데이터)가 끊어졌습니다.");

        const safePayload = (typeof payload === 'object' && payload !== null && !Array.isArray(payload)) ? payload : {};
        let lastError;

        for (let i = 0; i <= retries; i++) {
            let controller = new AbortController();
            let timeoutId = setTimeout(() => controller.abort(), 10000); // 10초 타임아웃 제한

            try {
                const response = await fetch(CONFIG.API.BASE_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, 
                    redirect: "follow", body: JSON.stringify({ action: "login", ...safePayload }),
                    signal: controller.signal
                });
                
                clearTimeout(timeoutId);

                if (!response.ok) {
                    const httpError = new Error(`HTTP ${response.status}`);
                    httpError.httpStatus = response.status;
                    throw httpError;
                }

                const rawText = await response.text();
                controller = null; // GC 가비지 컬렉터 지원
                
                let jsonResult;
                try {
                    jsonResult = JSON.parse(rawText);
                } catch (parseErr) {
                    throw new Error("서버 응답 포맷이 올바르지 않습니다.");
                }

                if (!jsonResult || typeof jsonResult !== 'object' || Array.isArray(jsonResult)) {
                    throw new Error("서버 응답 형식이 올바르지 않습니다.");
                }

                return jsonResult;
            } catch (err) {
                clearTimeout(timeoutId);
                lastError = err;
                
                if (err && err.httpStatus) {
                    if (err.httpStatus === 429) throw new Error("서버 지연 중입니다. (HTTP 429)");
                    if (err.httpStatus === 503) throw new Error("서버 점검 중입니다. (HTTP 503)");
                    throw err;
                }
                
                if (err.message && err.message.includes("Failed to fetch")) {
                    throw new Error("🚨 구글 서버 접근 차단됨(CORS)<br><span class='text-[10px] text-gray-400 mt-1 block'>구글 스크립트 배포 권한을 '모든 사용자'로 변경하세요.</span>");
                }

                if (i < retries) {
                    const waitTime = (Math.pow(1.5, i) * 1000) + Math.floor(Math.random() * 500); 
                    if (errorMsg) errorMsg.innerHTML = `<span class="animate-pulse text-amber-400">재시도 중... (${i+1}/2)</span>`;
                    await new Promise(res => setTimeout(res, waitTime));
                }
            }
        }
        throw new Error(lastError?.name === 'AbortError' ? "서버 응답 시간 초과 (10초 지연)<br><span class='text-[10px] text-gray-400'>콜드 스타트 중일 수 있으니 잠시 후 시도하세요.</span>" : (lastError?.message || "서버 통신 실패."));
    }

    // 폼 제출 메인 로직
    async function handleLogin(e) {
        if (e) e.preventDefault();
        if (isAuthenticating) return;

        const id = idInput ? String(idInput.value).replace(/[\s\u200B-\u200D\uFEFF\xA0]+/g, '') : "";
        const pw = pwInput ? String(pwInput.value).trim() : "";

        if (!id || !pw) {
            if(errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">ID와 Password를 모두 입력해주세요.</span>`;
            return;
        }

        isAuthenticating = true;
        const originalBtnText = loginBtn ? loginBtn.innerHTML : "Secure Login";
        if (loginBtn) {
            loginBtn.disabled = true;
            loginBtn.style.background = "#151515";
            loginBtn.style.color = "#E84C60";
            loginBtn.style.border = "1px solid #E84C60";
            loginBtn.innerHTML = `<span class="flex items-center justify-center gap-2"><svg class="animate-spin h-4 w-4 text-[#E84C60]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> AUTHENTICATING...</span>`;
        }
        if (errorMsg) errorMsg.innerText = "";

        try {
            const result = await executeLogin({ id: id, pw: pw });

            if (result && result.success) {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-emerald-400 font-bold">✅ SECURE SESSION ESTABLISHED</span>`;
                
                try {
                    localStorage.clear();
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_TOKEN, result.token);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.ROLE, result.role);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.CLIENT_NAME, result.clientName);
                    localStorage.setItem(CONFIG.STORAGE_KEYS.USER_ID, id);
                    localStorage.setItem("y2c_premium_state", result.clientState || "DEFAULT");
                } catch(stErr) {}

                if (loginForm) { loginForm.style.opacity = "0.5"; }
                
                setTimeout(() => {
                    window.location.replace((result.role === "MASTER" || result.role === "VENDOR") ? "admin.html" : "items.html");
                }, 300);

            } else {
                if (errorMsg) errorMsg.innerHTML = `<span class="text-[#FF3B5C]">⚠️ ${escapeHtml(result?.message || "인증에 실패했습니다.")}</span>`;
            }
        } catch (err) {
            if (errorMsg) {
                errorMsg.innerHTML = `<span class="text-[#FF3B5C]">${err.message}</span>`;
            }
        } finally {
            isAuthenticating = false;
            if (loginBtn && (!result || !result.success)) {
                loginBtn.disabled = false; 
                loginBtn.innerHTML = originalBtnText; 
                loginBtn.style.background = ""; 
                loginBtn.style.color = "";
                loginBtn.style.border = "";
            }
        }
    }

    if (loginForm) {
        loginForm.addEventListener("submit", handleLogin);
    }
});
</script>
</body>
</html>
