    <!-- 🌟 FOUC Absolute Fail-Safe -->
    <style>
        .fouc-lock { opacity: 0 !important; visibility: hidden !important; }
        .fade-out-route { opacity: 0 !important; transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1) !important; pointer-events: none; }
    </style>
    <script>
        document.documentElement.classList.add('fouc-lock');
        window._foucTimer = setTimeout(function() {
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) {
                document.body.classList.remove('fouc-lock');
                document.body.style.opacity = '1';
            }
        }, 800);

        window.addEventListener('load', function() {
            clearTimeout(window._foucTimer);
            document.documentElement.classList.remove('fouc-lock');
            document.documentElement.style.opacity = '1';
            document.documentElement.style.visibility = 'visible';
            if(document.body) {
                document.body.classList.remove('fouc-lock');
                document.body.style.opacity = '1';
            }
        });

        window.addEventListener('touchstart', function() {}, {passive: true});
        window.addEventListener('wheel', function() {}, {passive: true});
    </script>

    <style>
        :root {
            --sinjeon-pink: #E3000F; 
            --premium-charcoal: #111827; 
            --bg-light: #F8F9FA;
            --input-bg: #f8fafc;
        }
        
        /* 🚨 [모바일 최적화] 가상 키보드 스퀴즈 방어 & 상하 스크롤 허용 */
        html, body { 
            overscroll-behavior-y: none; 
            touch-action: manipulation; 
            background-color: var(--bg-light) !important; 
            color: var(--premium-charcoal); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            min-height: 100dvh;
            -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; 
            transform: translateZ(0); 
        }

        /* 모바일에서 폼이 잘리지 않도록 overflow-y-auto 허용 */
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            overflow-y: auto;
            padding: 1rem;
            /* Safe area for mobile notch */
            padding-bottom: max(env(safe-area-inset-bottom), 1.5rem);
            padding-top: max(env(safe-area-inset-top), 1.5rem);
        }

        .font-montserrat { font-family: 'Montserrat', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .solid-panel {
            background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.04);
            border-radius: 2.5rem; position: relative; z-index: 10;
        }
        
        /* 🌟 Inner-Floating 방식 프리미엄 인풋 박스 (iOS 줌인 방어: font-size 16px) */
        .premium-input {
            appearance: none; -webkit-appearance: none; background: var(--input-bg);
            border: 1.5px solid #e2e8f0; color: var(--premium-charcoal);
            font-size: 16px !important; font-weight: 700; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-radius: 1rem; width: 100%; height: 4.25rem; 
            padding-top: 1.7rem !important; padding-bottom: 0.5rem !important;
            padding-left: 3.25rem !important; padding-right: 1rem !important;
        }
        
        .premium-input:focus {
            background: #ffffff; border-color: var(--premium-charcoal);
            outline: none; transform: translateY(-1px);
        }
        
        .premium-input.input-error {
            border-color: var(--sinjeon-pink) !important; background-color: #FEF2F2 !important; 
            box-shadow: 0 0 0 4px rgba(227, 0, 15, 0.15), inset 0 2px 4px 0 rgba(227, 0, 15, 0.05) !important;
        }
        .premium-input.input-error ~ .floating-label, .premium-input.input-error ~ .input-icon { color: var(--sinjeon-pink) !important; }

        .premium-input::placeholder { color: transparent; }
        .input-icon { transition: color 0.3s cubic-bezier(0.4, 0, 0.2, 1); color: #94a3b8; }
        .premium-input:focus ~ .input-icon { color: var(--premium-charcoal); }

        input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus, input:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #111827 !important; transition: background-color 5000s ease-in-out 0s;
        }

        /* 🌟 플로팅 레이블 Inner 안착 아키텍처 */
        .floating-label-group { position: relative; }
        .floating-label {
            position: absolute; left: 3.25rem; top: 50%; transform: translateY(-50%);
            font-size: 14px; color: #64748b; pointer-events: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Inter', sans-serif; font-weight: 700; letter-spacing: 0.03em; z-index: 10; margin: 0;
        }
        
        .premium-input:focus ~ .floating-label,
        .premium-input:not(:placeholder-shown) ~ .floating-label {
            top: 15px; transform: translateY(-50%) scale(0.75); transform-origin: left center;
            color: #94a3b8; background: transparent; padding: 0; border: none; box-shadow: none;
        }
        .premium-input:focus ~ .floating-label { color: var(--premium-charcoal); }

        /* 🌟 3D 마그네틱 SECURE LOGIN 버튼 */
        .btn-hip {
            background: linear-gradient(135deg, var(--sinjeon-pink) 0%, #A3000B 100%);
            color: #ffffff; border: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative; overflow: hidden; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
        }
        .btn-hip::after {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: none;
        }
        .btn-hip:hover:not(:disabled) { transform: translateY(-3px); letter-spacing: 0.25em; }
        .btn-hip:hover:not(:disabled):after { left: 200%; transition: left 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-hip:active:not(:disabled) { transform: translateY(1px) scale(0.98); box-shadow: 0 2px 10px rgba(227, 0, 15, 0.2); }
        .btn-hip:disabled { background: #cbd5e1; transform: none; box-shadow: none; cursor: not-allowed; letter-spacing: 0.1em; }

        .text-glow { text-shadow: 0 2px 10px rgba(0, 0, 0, 0.05); }
        .text-glow-red { text-shadow: 0 2px 15px rgba(227, 0, 15, 0.2); }
        ::-webkit-scrollbar { display: none; }

        /* 🌟 시네마틱 등장 애니메이션 */
        .cinematic-enter { animation: fadeUpCinematic 0.8s cubic-bezier(0.2, 0.8, 0.2, 1) both; will-change: opacity, transform; }
        .delay-100 { animation-delay: 0.1s; } 
        @keyframes fadeUpCinematic { 
            0% { opacity: 0; transform: translateY(20px) translateZ(0); }
            100% { opacity: 1; transform: translateY(0) translateZ(0); } 
        }

        @keyframes error-shake {
            0%, 100% { transform: translateX(0) translateZ(0); opacity: 1 !important; }
            20% { transform: translateX(-8px) translateZ(0); opacity: 1 !important; }
            40% { transform: translateX(8px) translateZ(0); opacity: 1 !important; }
            60% { transform: translateX(-4px) translateZ(0); opacity: 1 !important; }
            80% { transform: translateX(4px) translateZ(0); opacity: 1 !important; }
        }
        .shake-animation { animation: error-shake 0.5s cubic-bezier(.36,.07,.19,.97) both !important; }

        /* Caps Lock 아코디언 */
        .alert-slide { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; max-height: 0; overflow: hidden; margin-top: 0; padding-left: 0.5rem; }
        .alert-slide.active { opacity: 1; max-height: 30px; margin-top: 8px; }
        
        #premiumToastContainer { position: fixed; top: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
    </style>
</head>

    <!-- 🌟 제로 레이턴시 라우팅 (Zero-Latency Routing) & Fade-out UX -->
    <script>
        (function() {
            try {
                var _sysRole = String(localStorage.getItem("y2c_role") || sessionStorage.getItem("y2c_role") || "").toUpperCase().trim();
                var _sysToken = String(localStorage.getItem("y2c_token") || sessionStorage.getItem("y2c_token") || "").trim();
                
                if (_sysRole && _sysRole !== "NULL" && _sysToken && _sysToken.length > 10) {
                    // 로그인 세션이 존재하면 즉각적으로 페이드아웃 후 무지연 라우팅 실행
                    document.documentElement.classList.add('fade-out-route');
                    if (_sysRole === "VENDOR" || _sysRole === "MASTER") { window.location.replace("admin.html"); } 
                    else if (_sysRole === "PARTNER") { window.location.replace("dashboard.html"); } 
                    else { window.location.replace("items.html"); }
                } else {
                    const keysToClear = ["y2c_token", "y2c_role", "y2c_client", "y2c_id", "y2c_premium_state", "y2c_region", "y2c_lang"];
                    keysToClear.forEach(function(k) { localStorage.removeItem(k); sessionStorage.removeItem(k); });
                }
            } catch (e) { console.error("[Y2C Boot Init]", e); }
        })();
    </script>

                        </button>

                    <svg class="w-3.5 h-3.5 animate-pulse" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path></svg>
                    Caps Lock is ON

                <!-- Biometric UI Hint -->
                <div class="flex justify-between items-center px-1 mt-1 mb-2 hidden sm:flex opacity-60">
                    <span class="text-[9px] text-gray-400 font-bold tracking-widest uppercase">Secure Auth Level 4</span>
                    <svg class="w-4 h-4 text-gray-400 animate-heartbeat" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 008 4.07M3 15.364c.64-1.319 1-2.8 1-4.364 0-1.457.39-2.823 1.07-4"></path></svg>
                </div>

                <!-- 🌟 3D 마그네틱 SECURE LOGIN 버튼 -->
                <button type="submit" id="loginBtn" class="btn-hip shadow-premium-btn hover:shadow-premium-btn-hover w-full font-montserrat font-black text-[13.5px] tracking-[0.2em] uppercase py-5 rounded-xl mt-3 flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-[#E3000F] focus:ring-offset-2 focus:ring-offset-[#ffffff]">
                    <span id="btnText">Secure Login</span>
                    <div id="btnSpinner" class="hidden flex items-center justify-center gap-3">
                        <svg class="animate-spin h-5 w-5 text-white drop-shadow-md" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">

                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>

                <p class="font-montserrat text-[9px] font-bold text-gray-400 tracking-[0.2em] uppercase opacity-80">
                    Operated by Y2C Holdings Inc.
                </p>
                <div class="flex items-center justify-center gap-2">
                    <p class="font-montserrat text-[8.5px] font-black text-emerald-600 tracking-[0.2em] uppercase flex items-center justify-center gap-1.5">
                        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span> System V69.00
                    </p>
                    <span class="text-gray-300 text-[8px]">|</span>
                    <!-- 🚨 [CRITICAL FIX] 세션 초기화 및 Deep Nuke 강제 실행 버튼 -->
                    <button type="button" id="indexLogoutBtn" class="font-montserrat text-[8.5px] font-black text-gray-400 tracking-[0.1em] uppercase transition-colors hover:text-[#E3000F] focus:outline-none" title="Clear all local caches, zombie workers, and session tokens.">

    <div id="premiumToastContainer"></div>

    <!-- 🚨 코어 엔진 바인딩 -->
    <script src="assets/js/config.js"></script>
    <script src="assets/js/auth.js"></script>

    <!-- 🌟 [PWA 엔진 점화] 모바일 네이티브 앱 설치 지원 -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('[Y2C PWA] Service Worker Registered.', reg.scope))
                    .catch(err => console.error('[Y2C PWA] SW Registration Failed.', err));
            });
        }
    </script>

    <script>
    /**
     * 🌟 V69.00 Enterprise Login Engine (Deep Nuke, Mobile Optimized & Retry Feedback UI)
     */
    document.addEventListener("DOMContentLoaded", () => {
        
        // 1. Dynamic Greeting (Enterprise Wording)
        const greetingEl = document.getElementById('dynamicGreeting');
        if (greetingEl) {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) greetingEl.innerText = "Good Morning, Partner";
            else if (hour >= 12 && hour < 18) greetingEl.innerText = "Good Afternoon, Partner";
            else greetingEl.innerText = "Good Evening, Partner";
        }

        // 2. Password Visibility Toggle
        const pwInput = document.getElementById("userPw");
        const togglePwBtn = document.getElementById('togglePwBtn');
        const eyeOpen = document.getElementById('eyeIconOpen');
        const eyeClosed = document.getElementById('eyeIconClosed');
        
        if(togglePwBtn && pwInput) {
            togglePwBtn.addEventListener('click', () => {
                if(pwInput.type === 'password') {
                    pwInput.type = 'text';
                    pwInput.classList.remove('tracking-[0.3em]');
                    eyeClosed.classList.add('hidden');
                    eyeOpen.classList.remove('hidden');
                } else {
                    pwInput.type = 'password';
                    pwInput.classList.add('tracking-[0.3em]');
                    eyeOpen.classList.add('hidden');
                    eyeClosed.classList.remove('hidden');
                }
            });
        }

        // 3. Caps Lock Warning Engine
        const capsLockWarning = document.getElementById("capsLockWarning");
        if (pwInput && capsLockWarning) {
            pwInput.addEventListener('keyup', (e) => {
                if (e.getModifierState && e.getModifierState('CapsLock')) { 
                    capsLockWarning.classList.add('active'); 
                } else { 
                    capsLockWarning.classList.remove('active'); 
                }
            });
            pwInput.addEventListener('blur', () => { capsLockWarning.classList.remove('active'); });
        }

        // 4. [UX UPGRADE] Input Whitespace Auto-Trim
        const userIdInput = document.getElementById('userId');
        if(userIdInput) {
            userIdInput.addEventListener('blur', (e) => {
                e.target.value = e.target.value.trim();
            });
        }

        // 5. Secure Core Engine Binding (auth.js V66.00+)
        if (typeof Y2C_AuthEngine !== 'undefined') {
            
            // 🚨 Custom Login Listener override to implement Retry Feedback UI
            const form = document.getElementById('loginForm');
            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    
                    const hp = document.getElementById('hp_field');
                    if (hp && hp.value) return; 

                    const id = (userIdInput.value || "").trim();
                    const pw = (userPwInput.value || "").trim();

                    userIdInput.classList.remove('input-error');
                    userPwInput.classList.remove('input-error');

                    if (!id || !pw) {
                        Y2C_AuthEngine.showToast("보안 인가 실패: 파트너 식별자(ID) 및 패스키(Passkey)를 모두 입력해 주십시오.", "error");
                        if (!id) userIdInput.classList.add('input-error');
                        if (!pw) userPwInput.classList.add('input-error');
                        return;
                    }

                    const btn = document.getElementById('loginBtn');
                    const btnText = document.getElementById('btnText');
                    const btnSpinner = document.getElementById('btnSpinner');
                    const spinnerTxt = document.getElementById('btnSpinnerText');

                    btn.disabled = true;
                    if(btnText) btnText.classList.add('hidden');
                    if(btnSpinner) btnSpinner.classList.remove('hidden');

                    setTimeout(() => { userIdInput.blur(); userPwInput.blur(); }, 500);

                    // 🚨 [CRITICAL FIX 2] Retry Visualization Engine
                    // 사용자가 시스템 프리징으로 착각하지 않도록 백그라운드 리트라이 과정을 텍스트로 중계합니다.
                    let txtState = 0;
                    let loadingInterval = setInterval(() => {
                        if(spinnerTxt) {
                            txtState++;
                            if(txtState % 4 === 1) spinnerTxt.innerText = "SECURING...";
                            else if(txtState % 4 === 2) spinnerTxt.innerText = "WAKING SERVER...";
                            else if(txtState % 4 === 3) spinnerTxt.innerText = "BYPASSING LATENCY..."; 
                            else spinnerTxt.innerText = "VERIFYING...";
                        }
                    }, 2500);

                    try {
                        // Request is handled by NetworkEngine (auth.js)
                        const res = await Y2C_AuthEngine.request("login", { id: id, pw: pw });

                        if (res && res.success) {
                            res.id = id; 
                            // Direct Session Saving bypass
                            const keysToClear = ["y2c_token", "y2c_role", "y2c_client", "y2c_id", "y2c_premium_state", "y2c_region", "y2c_lang"];
                            keysToClear.forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
                            localStorage.setItem("y2c_token", res.token); localStorage.setItem("y2c_role", res.role);
                            localStorage.setItem("y2c_client", res.clientName); localStorage.setItem("y2c_region", res.allowedStates || res.clientState || "ON");
                            localStorage.setItem("y2c_id", res.id || "");
                            
                            Y2C_AuthEngine.showToast(`보안 세션 인가 완료. ${res.clientName} 파트너님의 엔터프라이즈 워크스페이스로 접속합니다.`, "success");
                            
                            setTimeout(() => {
                                document.documentElement.classList.add('fade-out-route');
                                if (res.role === "MASTER" || res.role === "VENDOR") { window.location.replace("admin.html"); } 
                                else if (res.role === "PARTNER") { window.location.replace("dashboard.html"); } 
                                else { window.location.replace("items.html"); }
                            }, 800);
                        }
                    } catch (err) {
                        let finalMsg = err.message;
                        // 백그라운드 최대 재시도(Max Retries)마저 모두 소진되어 최종 실패했을 때의 안내 표출
                        if(err.message.includes("초과") || err.message.includes("장애") || err.message.includes("유실") || err.name === 'AbortError') {
                            finalMsg = "서버 응답 지연: 구글 데이터 노드 연결을 재시도합니다. 로그인 버튼을 한 번 더 눌러주십시오.";
                        }
                        
                        Y2C_AuthEngine.showToast(finalMsg, "error");
                        userIdInput.classList.add('input-error');
                        userPwInput.classList.add('input-error');
                        form.classList.remove('shake-animation');
                        void form.offsetWidth; 
                        form.classList.add('shake-animation');
                    } finally {
                        clearInterval(loadingInterval);
                        if(spinnerTxt) spinnerTxt.innerText = "VERIFYING...";
                        btn.disabled = false;
                        if(btnText) btnText.classList.remove('hidden');
                        if(btnSpinner) btnSpinner.classList.add('hidden');
                    }
                });
            }
        } else {
            console.error("CRITICAL ERROR: Y2C_AuthEngine is not loaded.");
        }

        // 6. 🚨 비상 세션 초기화 및 Deep Nuke 실행 (Reset Session / Fallback Logout)
        const indexLogoutBtn = document.getElementById('indexLogoutBtn');
        if (indexLogoutBtn) {
            indexLogoutBtn.addEventListener('click', () => {
                if (typeof Y2C_AuthEngine !== 'undefined' && Y2C_AuthEngine.logout) {
                    Y2C_AuthEngine.logout();
                } else {
                    // Fallback absolute clearance (Storage)
                    const keys = ["y2c_token", "y2c_role", "y2c_client", "y2c_id", "y2c_premium_state", "y2c_region", "y2c_lang"];
                    keys.forEach(k => { localStorage.removeItem(k); sessionStorage.removeItem(k); });
                    
                    // 🚨 Fallback Deep Nuke (Service Worker & Cache)
                    if ('serviceWorker' in navigator) {
                        navigator.serviceWorker.getRegistrations().then(function(registrations) {
                            for(let registration of registrations) { registration.unregister(); }
                        });
                    }
                    if ('caches' in window) {
                        caches.keys().then(names => {
                            for (let name of names) { 
                                if (name.includes('Y2C')) caches.delete(name); 
                            }
                        });
                    }
                    
                    setTimeout(() => { window.location.reload(); }, 500);
                }
            });
        }
    });
    </script>
