# Save as .github/workflows/sinjeon-pages.yml in eunbeenlee/y2c-advisory-portal.
# Save portal-deploy.py next to index.html. Keep the existing custom domain.
# Manual deployment only: uploading this file does not deploy the site.
name: SINJEON verified Pages deployment
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Regression tests for deployment guard
        env:
          PORTAL_SOURCE: .
          PORTAL_DEPLOY_TOOL: portal-deploy.py
          PORTAL_DEPLOY_FIXTURE: .github/checks/repo-assetlinks.json
        run: python3 .github/checks/test_deployment.py
      - name: Check external and inline JavaScript syntax
        run: python3 portal-deploy.py check-syntax --source .
      - name: Record source revision
        run: |
          echo "### SINJEON deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "This workflow publishes web assets only. Database and Apps Script are untouched." >> "$GITHUB_STEP_SUMMARY"
      - name: Confirm existing repository and domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 portal-deploy.py github-site
      - name: Validate and stage public release
        run: python3 portal-deploy.py stage --source . --output _portal_site --report preflight-result.json
      - name: Upload including Android association
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _portal_site
          include-hidden-files: true
      - name: Check the actual upload archive
        run: |
          python3 - <<'PY'
          import os, tarfile
          with tarfile.open(os.path.join(os.environ['RUNNER_TEMP'], 'artifact.tar')) as archive:
              entries = archive.getmembers()
              names = {item.name.removeprefix('./') for item in entries}
              assert '.well-known/assetlinks.json' in names, 'Android association omitted from archive'
              assert '.nojekyll' in names, 'Static publishing marker omitted from archive'
              assert not any(item.issym() or item.islnk() for item in entries), 'Links are not permitted'
          PY

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      - name: Verify the published site
        run: |
          passed=0
          for attempt in 1 2 3 4 5 6; do
            if python3 portal-deploy.py verify --source . --report live-result.json; then
              passed=1
              break
            fi
            sleep 10
          done
          if [ "$passed" != 1 ]; then
            echo "::error::Published files do not match. Review live-result.json output. No automatic rollback or data reset was performed."
            exit 1
          fi
