              <th id="stockHeaderLabel" scope="col" class="px-5 sm:px-6 py-5 text-center text-[10px] sm:text-[11px] font-black text-[var(--y2c-gold)] uppercase tracking-[0.15em] whitespace-nowrap border-l border-gray-200 bg-[var(--y2c-gold)]/5">Inventory Status</th>
              
              <th scope="col" class="px-5 sm:px-6 py-5 text-center text-[10px] sm:text-[11px] font-black text-[#E84C60] uppercase tracking-[0.15em] whitespace-nowrap border-l border-gray-200 bg-[#E84C60]/5">Order Qty</th>
