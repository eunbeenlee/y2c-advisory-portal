<!-- items.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Item List - Sinjeon Canada Partner Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-sinjeon { background-color: #E53935; }
    .text-sinjeon { color: #E53935; }
  </style>
</head>
<body class="bg-gray-50 font-sans">
  
  <!-- 상단 네비게이션 바 -->
  <nav class="bg-sinjeon text-white p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold">Sinjeon Portal</h1>
      <div class="flex space-x-4 items-center">
        <span id="userNameDisplay" class="text-sm font-medium bg-red-800 px-3 py-1 rounded-full"></span>
        <button id="logoutBtn" class="text-sm bg-white text-red-600 font-bold px-3 py-1 rounded hover:bg-gray-100 transition">Logout</button>
      </div>
    </div>
  </nav>

  <!-- 메인 컨텐츠 영역 -->
  <main class="max-w-6xl mx-auto mt-8 p-4">
    
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-2xl font-bold text-gray-800">📦 Franchise Item List</h2>
      <a href="dashboard.html" class="bg-gray-200 text-gray-700 px-4 py-2 rounded font-medium hover:bg-gray-300 transition">
        ← Back to Dashboard
      </a>
    </div>

    <!-- 품목 리스트 테이블 박스 -->
    <div class="bg-white rounded-lg shadow overflow-hidden">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-100">
          <tr>
            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Item Code</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Item Name</th>
            <th scope="col" class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Category</th>
            <th scope="col" class="px-6 py-3 text-right text-xs font-bold text-gray-500 uppercase tracking-wider">Unit Price (CAD)</th>
          </tr>
        </thead>
        <tbody id="itemTableBody" class="bg-white divide-y divide-gray-200">
          <!-- 로딩 상태 표시 -->
          <tr>
            <td colspan="4" class="px-6 py-10 text-center text-gray-500 font-medium">
              Loading items...
            </td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/items.js"></script>
</body>
</html>
