<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Sinjeon Canada Partner Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 font-sans">
  
  <nav class="bg-white shadow-md border-b-4 border-red-600">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center py-3">
      <div class="flex items-center space-x-4">
        <img src="assets/images/Sinjeon_Logo_Pink.png" alt="Sinjeon Logo" class="h-10 object-contain">
        <div class="border-l-2 border-gray-200 pl-4">
          <h1 class="text-xl font-extrabold text-gray-900 leading-tight">Partner Portal</h1>
          <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">Operated by Y2C Holdings Inc.</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-8">
        <a href="dashboard.html" class="text-red-600 font-bold border-b-2 border-red-600 pb-1">Dashboard</a>
        <a href="items.html" class="text-gray-600 hover:text-red-600 font-bold transition">Item List</a>
        <a href="invoice.html" id="navInvoice" class="hidden text-gray-600 hover:text-red-600 font-bold transition">Advisory Invoice</a>
        
        <div class="flex items-center space-x-3 bg-gray-50 py-1.5 px-3 rounded-lg border">
          <span id="userNameDisplay" class="text-sm font-bold text-gray-800"></span>
          <button id="logoutBtn" class="text-xs bg-gray-800 text-white font-bold px-3 py-1.5 rounded hover:bg-gray-700 transition">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto mt-8 p-4">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 border-l-4 border-l-red-500">
        <h3 class="text-gray-400 text-sm font-bold uppercase tracking-wider">Total Net Sales (YTD)</h3>
        <p class="text-3xl font-extrabold mt-2 text-gray-800" id="totalSales">Loading...</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 border-l-4 border-l-blue-500">
        <h3 class="text-gray-400 text-sm font-bold uppercase tracking-wider">POS Sales (YTD)</h3>
        <p class="text-3xl font-extrabold mt-2 text-gray-800" id="posSales">-</p>
      </div>
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 border-l-4 border-l-green-500">
        <h3 class="text-gray-400 text-sm font-bold uppercase tracking-wider">Delivery Sales (YTD)</h3>
        <p class="text-3xl font-extrabold mt-2 text-gray-800" id="deliverySales">-</p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-100 mb-8">
      <h2 class="text-lg font-bold mb-4 text-gray-800">Monthly Revenue Trend</h2>
      <canvas id="salesChart" height="90"></canvas>
    </div>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/dashboard.js"></script>
  <script>
    // 마스터 권한일 경우에만 인보이스 메뉴 노출
    if(localStorage.getItem(SYSTEM_CONFIG.STORAGE_KEYS.ROLE) === "MASTER") {
      document.getElementById('navInvoice').classList.remove('hidden');
    }
  </script>
</body>
</html>
